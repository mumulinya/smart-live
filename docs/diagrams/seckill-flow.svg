<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id='title'>秒杀抢购与超时回滚链路</title>
  <desc id='desc'>展示秒杀活动预热、Redis Lua 原子预扣、RabbitMQ 异步建单、库存扣减消息批量落库，以及延迟队列未支付回滚流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fbff"/><stop offset="100%" stop-color="#eef5ff"/></linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="#335c9e"/></marker>
    <style>.title{font:700 34px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#16335b}.subtitle{font:500 17px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#486586}.section{font:700 22px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#1f4b82}.node-title{font:700 22px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#12314f}.node-text{font:500 16px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#35506f}.step{font:600 15px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#24476f}.note-title{font:700 19px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#21415d}.note-text{font:500 15px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#506882}.node{fill:#fff;stroke:#9cb9de;stroke-width:2;rx:24}.store{fill:#f1fbf6;stroke:#9fd0b3;stroke-width:2;rx:24}.gateway{fill:#fff6ec;stroke:#f0b37a;stroke-width:2;rx:24}.note{fill:#fff;stroke:#d5e2f3;stroke-width:1.5;rx:20}.line{stroke:#335c9e;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#6d90bf;stroke-width:3;stroke-dasharray:8 8;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1800" height="1040" fill="url(#bg)"/>
  <rect x="34" y="34" width="1732" height="972" rx="30" fill="#ffffff" stroke="#d9e6f5" stroke-width="2"/>
  <text class='title' x='74' y='96'>秒杀抢购与超时回滚链路</text>
  <text class='subtitle' x='74' y='132'>对应代码：ProductSeckillJobHandler + SeckillPurchaseStrategy + OrderService.createOrder + ProductListener.batchDeductStock</text>
  <text class='section' x='74' y='188'>1. 预热库存与原子校验</text>
  <rect class='node' x='70' y='220' width='250' height='140'/>
  <text class='node-title' x='195' y='270' text-anchor='middle'>XXL-JOB 预热</text>
  <text class='node-text' x='195' y='304' text-anchor='middle'>扫描未来 2 小时</text>
  <text class='node-text' x='195' y='328' text-anchor='middle'>秒杀商品</text>
  <rect class='node' x='390' y='220' width='280' height='140'/>
  <text class='node-title' x='530' y='270' text-anchor='middle'>smartLive-product</text>
  <text class='node-text' x='530' y='304' text-anchor='middle'>加载商品快照</text>
  <text class='node-text' x='530' y='328' text-anchor='middle'>准备活动状态</text>
  <rect class='store' x='740' y='220' width='280' height='140'/>
  <text class='node-title' x='880' y='270' text-anchor='middle'>Redis 秒杀键</text>
  <text class='node-text' x='880' y='304' text-anchor='middle'>seckill:stock:*</text>
  <text class='node-text' x='880' y='328' text-anchor='middle'>seckill:order:*</text>
  <rect class='node' x='1090' y='220' width='260' height='140'/>
  <text class='node-title' x='1220' y='270' text-anchor='middle'>用户抢购请求</text>
  <text class='node-text' x='1220' y='304' text-anchor='middle'>/product/purchase</text>
  <text class='node-text' x='1220' y='328' text-anchor='middle'>进入策略路由</text>
  <rect class='gateway' x='1420' y='220' width='310' height='140'/>
  <text class='node-title' x='1575' y='270' text-anchor='middle'>SeckillPurchaseStrategy</text>
  <text class='node-text' x='1575' y='304' text-anchor='middle'>Lua 原子校验</text>
  <text class='node-text' x='1575' y='328' text-anchor='middle'>发 ORDER_SECKILL_QUEUE</text>
  <path class='line' d='M320 290 H378'/>
  <text class='step' x='349' y='194' text-anchor='middle'>1. seckillPreHeat</text>
  <text class='step' x='349' y='214' text-anchor='middle'>提前加载库存</text>
  <path class='line' d='M670 290 H728'/>
  <text class='step' x='699' y='194' text-anchor='middle'>2. 预热后的 key</text>
  <text class='step' x='699' y='214' text-anchor='middle'>支撑高并发读写</text>
  <path class='line' d='M1020 290 H1078'/>
  <text class='step' x='1049' y='194' text-anchor='middle'>3. 前端发起</text>
  <text class='step' x='1049' y='214' text-anchor='middle'>秒杀抢购</text>
  <path class='line' d='M1350 290 H1408'/>
  <text class='step' x='1379' y='194' text-anchor='middle'>4. 原子判定</text>
  <text class='step' x='1379' y='214' text-anchor='middle'>库存和一人一单</text>
  <text class='section' x='74' y='468'>2. 异步建单、库存批量落库与超时回滚</text>
  <rect class='node' x='70' y='500' width='280' height='140'/>
  <text class='node-title' x='210' y='550' text-anchor='middle'>OrderListener</text>
  <text class='node-text' x='210' y='584' text-anchor='middle'>handleSeckillOrder</text>
  <text class='node-text' x='210' y='608' text-anchor='middle'>messageId 幂等</text>
  <rect class='node' x='410' y='500' width='310' height='140'/>
  <text class='node-title' x='565' y='550' text-anchor='middle'>smartLive-order</text>
  <text class='node-text' x='565' y='584' text-anchor='middle'>createOrder 落库</text>
  <text class='node-text' x='565' y='608' text-anchor='middle'>发送库存扣减 MQ</text>
  <rect class='gateway' x='780' y='500' width='330' height='140'/>
  <text class='node-title' x='945' y='550' text-anchor='middle'>ProductListener</text>
  <text class='node-text' x='945' y='584' text-anchor='middle'>batchDeductStock</text>
  <text class='node-text' x='945' y='608' text-anchor='middle'>按商品聚合后批量 CAS</text>
  <rect class='gateway' x='1170' y='500' width='300' height='140'/>
  <text class='node-title' x='1320' y='550' text-anchor='middle'>ORDER_DELAY_EXCHANGE</text>
  <text class='node-text' x='1320' y='584' text-anchor='middle'>15 分钟未支付</text>
  <text class='node-text' x='1320' y='608' text-anchor='middle'>自动检查</text>
  <rect class='store' x='1530' y='500' width='220' height='140'/>
  <text class='node-title' x='1640' y='550' text-anchor='middle'>cancel / recover</text>
  <text class='node-text' x='1640' y='584' text-anchor='middle'>未支付则取消订单</text>
  <text class='node-text' x='1640' y='608' text-anchor='middle'>恢复库存和资格</text>
  <path class='line' d='M350 570 H398'/>
  <text class='step' x='374' y='474' text-anchor='middle'>5. MQ 消费</text>
  <text class='step' x='374' y='494' text-anchor='middle'>成功后手动 ACK</text>
  <path class='line' d='M720 570 H768'/>
  <text class='step' x='744' y='474' text-anchor='middle'>6. 建单成功</text>
  <text class='step' x='744' y='494' text-anchor='middle'>再发库存扣减 MQ</text>
  <path class='line' d='M1110 570 H1158'/>
  <text class='step' x='1134' y='474' text-anchor='middle'>7. 批量扣数据库库存</text>
  <text class='step' x='1134' y='494' text-anchor='middle'>CAS 防止超扣</text>
  <path class='line' d='M1470 570 H1518'/>
  <text class='step' x='1494' y='474' text-anchor='middle'>8. 延迟回查</text>
  <text class='step' x='1494' y='494' text-anchor='middle'>未支付则回滚</text>
  <rect class='note' x='70' y='720' width='500' height='220'/>
  <text class='note-title' x='102' y='766'>这张图说明了什么</text>
  <text class='note-text' x='102' y='806'>- 秒杀真正的高并发点不在数据库，而在 Lua 原子校验。</text>
  <text class='note-text' x='102' y='836'>- 订单创建、库存落库、超时取消拆成多阶段，主链路不会被拖慢。</text>
  <text class='note-text' x='102' y='866'>- 预热和回收任务让秒杀活动具备完整生命周期。</text>
  <rect class='note' x='650' y='720' width='500' height='220'/>
  <text class='note-title' x='682' y='766'>代码里最值得看</text>
  <text class='note-text' x='682' y='806'>- ProductSeckillJobHandler 负责预热、临期提醒和结束回收。</text>
  <text class='note-text' x='682' y='836'>- SeckillPurchaseStrategy 用 seckill.lua 做 Redis 预扣和一人一单。</text>
  <text class='note-text' x='682' y='866'>- ProductListener.batchDeductStock 负责库存扣减消息聚合与 MySQL CAS 扣库。</text>
  <rect class='note' x='1230' y='720' width='500' height='220'/>
  <text class='note-title' x='1262' y='766'>文档展示建议</text>
  <text class='note-text' x='1262' y='806'>- README 里适合作为“极致秒杀”代表图。</text>
  <text class='note-text' x='1262' y='836'>- 如果要讲压测成绩，可以把“Redis 预扣 + MQ 批量扣库”一起说清楚。</text>
  <text class='note-text' x='1262' y='866'>- 这张图最好配一张秒杀页面截图。</text>
</svg>
