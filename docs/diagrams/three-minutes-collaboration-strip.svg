<svg width="1440" height="220" viewBox="0 0 1440 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#EEF6FF"/>
    </linearGradient>
    <filter id="shadow" x="-20" y="-20" width="1480" height="260" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#A9C8F2" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1440" height="220" rx="24" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="28" y="24" width="1384" height="172" rx="20" fill="#FFFFFF"/>
  </g>

  <text x="72" y="74" font-size="28" font-weight="700" fill="#1E293B" font-family="Segoe UI, Microsoft YaHei, Arial">别忽略这组协同强度数据</text>
  <text x="72" y="108" font-size="18" fill="#607089" font-family="Segoe UI, Microsoft YaHei, Arial">它们最能说明这不是“拆了几个服务名”的微服务项目，而是真正存在跨服务调用、异步解耦和调度补偿。</text>

  <rect x="72" y="132" width="392" height="40" rx="14" fill="#EEF8FF" stroke="#D6E9FF"/>
  <text x="92" y="158" font-size="18" fill="#1F3B63" font-family="Segoe UI, Microsoft YaHei, Arial">18 个 FeignClient：服务调用边界已经真实落地</text>

  <rect x="520" y="132" width="392" height="40" rx="14" fill="#EEF9F2" stroke="#D7F0DE"/>
  <text x="540" y="158" font-size="18" fill="#1F3B63" font-family="Segoe UI, Microsoft YaHei, Arial">30 个 RabbitMQ 监听器：消息驱动已进入主链路</text>

  <rect x="968" y="132" width="392" height="40" rx="14" fill="#FFF7EC" stroke="#FCE2B5"/>
  <text x="988" y="158" font-size="18" fill="#1F3B63" font-family="Segoe UI, Microsoft YaHei, Arial">26 个 XxlJob 处理器：补偿、提醒、重建都有调度兜底</text>
</svg>
