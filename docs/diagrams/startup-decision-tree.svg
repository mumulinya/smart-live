<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#ECFEFF"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 400 17px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #475569; }
      .node-title { font: 700 22px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #0F172A; }
      .node-body { font: 400 15px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #334155; }
      .node-tag { font: 700 14px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #1E293B; }
      .footer { font: 600 16px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #0F766E; }
    </style>
  </defs>

  <rect width="1200" height="700" rx="32" fill="url(#bg2)"/>
  <rect x="36" y="32" width="1128" height="636" rx="28" fill="#FFFFFF" fill-opacity="0.78" stroke="#D7F9F4"/>

  <text x="600" y="86" text-anchor="middle" class="title">第一次接入 SmartLive 应该怎么启动</text>
  <text x="600" y="118" text-anchor="middle" class="subtitle">先明确目标，再决定跑最小链路、完整链路，还是直接进入部署说明。</text>

  <g filter="url(#shadow2)">
    <rect x="420" y="152" width="360" height="90" rx="22" fill="#E0F2FE" stroke="#7DD3FC"/>
  </g>
  <text x="600" y="197" text-anchor="middle" class="node-title">你的目标是什么？</text>
  <text x="600" y="224" text-anchor="middle" class="node-body">别一次性把全部模块和中间件都拉起来，先确认这次接入想验证什么。</text>

  <path d="M600 242V300" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <path d="M600 300H234" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <path d="M600 300H600" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <path d="M600 300H966" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <path d="M234 300V332" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <path d="M600 300V332" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <path d="M966 300V332" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>

  <g filter="url(#shadow2)">
    <rect x="72" y="332" width="324" height="248" rx="24" fill="#FEF3C7" stroke="#FBBF24"/>
    <rect x="438" y="332" width="324" height="248" rx="24" fill="#DCFCE7" stroke="#4ADE80"/>
    <rect x="804" y="332" width="324" height="248" rx="24" fill="#F3E8FF" stroke="#C084FC"/>
  </g>

  <text x="102" y="372" class="node-tag">PATH A</text>
  <text x="102" y="408" class="node-title">先把服务跑起来</text>
  <text x="102" y="446" class="node-body">最小可运行链路</text>
  <text x="102" y="476" class="node-body">MySQL / Redis / Nacos / RabbitMQ</text>
  <text x="102" y="506" class="node-body">auth / gateway / system / user</text>
  <text x="102" y="536" class="node-body">shop / search</text>
  <text x="102" y="566" class="node-body">适合先验证登录、店铺、搜索、后台管理</text>

  <text x="468" y="372" class="node-tag">PATH B</text>
  <text x="468" y="408" class="node-title">体验完整业务能力</text>
  <text x="468" y="446" class="node-body">完整功能链路</text>
  <text x="468" y="476" class="node-body">补齐 ES / Milvus / MinIO / XXL-JOB / Sentinel</text>
  <text x="468" y="506" class="node-body">product / order / interaction / chat / im</text>
  <text x="468" y="536" class="node-body">ai / wallet / points / blog / audit / file</text>
  <text x="468" y="566" class="node-body">适合验证 RAG、审核、积分、支付和消息链路</text>

  <text x="834" y="372" class="node-tag">PATH C</text>
  <text x="834" y="408" class="node-title">准备部署或演示</text>
  <text x="834" y="446" class="node-body">直接看 DEPLOYMENT_GUIDE</text>
  <text x="834" y="476" class="node-body">关注 JAR 构建、镜像重建、Nacos、Docker</text>
  <text x="834" y="506" class="node-body">不要只执行 up，更新单服务要重建镜像</text>
  <text x="834" y="536" class="node-body">部署前先把敏感配置迁出仓库</text>
  <text x="834" y="566" class="node-body">适合做服务器演示、联调和生产前校验</text>

  <g filter="url(#shadow2)">
    <rect x="132" y="610" width="936" height="48" rx="18" fill="#ECFEFF" stroke="#99F6E4"/>
  </g>
  <text x="600" y="641" text-anchor="middle" class="footer">建议顺序：先走 PATH A，确认最小链路稳定，再按需扩展到 PATH B 或 PATH C。</text>
</svg>
