<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">发布审核与搜索同步链路</title>
  <desc id="desc">展示商家发布商品或店铺后，经过审核中心回调源服务，并同步 ES、Milvus、热榜等下游的流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfcff"/>
      <stop offset="100%" stop-color="#f3f8ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2d5d9f"/>
    </marker>
    <style>
      .title { font: 700 34px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #17365e; }
      .subtitle { font: 500 17px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #4b6988; }
      .section { font: 700 22px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #1d4b81; }
      .node-title { font: 700 22px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #143250; }
      .node-text { font: 500 16px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #35516e; }
      .step { font: 600 15px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #24486f; }
      .note-title { font: 700 19px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #23425f; }
      .note-text { font: 500 15px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #506983; }
      .node { fill: #ffffff; stroke: #a2bcdd; stroke-width: 2; rx: 24; }
      .mq { fill: #fff6eb; stroke: #efb882; stroke-width: 2; rx: 24; }
      .store { fill: #f2fbf5; stroke: #a6d5b6; stroke-width: 2; rx: 24; }
      .decision { fill: #f9f4ff; stroke: #c7a4eb; stroke-width: 2; rx: 24; }
      .note { fill: #ffffff; stroke: #d7e3f4; stroke-width: 1.5; rx: 20; }
      .line { stroke: #2d5d9f; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7d61bf; stroke-width: 3; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
      .pass { stroke: #2c8d63; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .reject { stroke: #c05050; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1080" fill="url(#bg)"/>
  <rect x="34" y="34" width="1732" height="1012" rx="30" fill="#ffffff" stroke="#d9e6f5" stroke-width="2"/>

  <text class="title" x="74" y="96">发布审核与搜索 / 向量同步链路</text>
  <text class="subtitle" x="74" y="132">对应代码：ProductServiceImpl.sendAuditMessage / updateProductStatus + AuditServiceImpl.handleAudit</text>

  <text class="section" x="74" y="188">提交与审核主链路</text>

  <rect class="node" x="70" y="220" width="240" height="140"/>
  <text class="node-title" x="190" y="270" text-anchor="middle">商家后台</text>
  <text class="node-text" x="190" y="304" text-anchor="middle">新增商品 / 店铺</text>

  <rect class="node" x="390" y="220" width="330" height="140"/>
  <text class="node-title" x="555" y="270" text-anchor="middle">商品 / 店铺服务</text>
  <text class="node-text" x="555" y="304" text-anchor="middle">落库为待审状态</text>
  <text class="node-text" x="555" y="328" text-anchor="middle">并发送 AuditMessage</text>

  <rect class="mq" x="800" y="220" width="250" height="140"/>
  <text class="node-title" x="925" y="270" text-anchor="middle">审核 MQ</text>
  <text class="node-text" x="925" y="304" text-anchor="middle">AUDIT_DIRECT_EXCHANGE</text>

  <rect class="node" x="1130" y="220" width="290" height="140"/>
  <text class="node-title" x="1275" y="270" text-anchor="middle">smartLive-audit</text>
  <text class="node-text" x="1275" y="304" text-anchor="middle">createAuditTask</text>
  <text class="node-text" x="1275" y="328" text-anchor="middle">+ AuditProcessChain</text>

  <rect class="decision" x="1500" y="220" width="240" height="140"/>
  <text class="node-title" x="1620" y="270" text-anchor="middle">审核决策</text>
  <text class="node-text" x="1620" y="304" text-anchor="middle">PASS / REJECT</text>
  <text class="node-text" x="1620" y="328" text-anchor="middle">/ WAITING</text>

  <path class="line" d="M310 290 H378"/>
  <text class="step" x="344" y="194" text-anchor="middle">1. 提交</text>
  <text class="step" x="344" y="214" text-anchor="middle">发布请求</text>

  <path class="line" d="M720 290 H788"/>
  <text class="step" x="754" y="194" text-anchor="middle">2. 发送</text>
  <text class="step" x="754" y="214" text-anchor="middle">AuditMessage</text>

  <path class="line" d="M1050 290 H1118"/>
  <text class="step" x="1084" y="194" text-anchor="middle">3. 异步</text>
  <text class="step" x="1084" y="214" text-anchor="middle">消费消息</text>

  <path class="line" d="M1420 290 H1488"/>
  <text class="step" x="1454" y="194" text-anchor="middle">4. 责任链</text>
  <text class="step" x="1454" y="214" text-anchor="middle">给出结论</text>

  <rect class="node" x="250" y="470" width="330" height="150"/>
  <text class="node-title" x="415" y="522" text-anchor="middle">回调源服务</text>
  <text class="node-text" x="415" y="556" text-anchor="middle">updateProductStatus</text>
  <text class="node-text" x="415" y="580" text-anchor="middle">或 updateShopStatus</text>

  <rect class="store" x="700" y="470" width="280" height="150"/>
  <text class="node-title" x="840" y="522" text-anchor="middle">ES / Milvus</text>
  <text class="node-text" x="840" y="556" text-anchor="middle">publish() 批量插入</text>
  <text class="node-text" x="840" y="580" text-anchor="middle">或删除索引</text>

  <rect class="store" x="1100" y="470" width="260" height="150"/>
  <text class="node-title" x="1230" y="522" text-anchor="middle">Redis 热榜</text>
  <text class="node-text" x="1230" y="556" text-anchor="middle">热门榜 / 计算队列</text>
  <text class="node-text" x="1230" y="580" text-anchor="middle">相关缓存更新</text>

  <rect class="mq" x="1480" y="470" width="250" height="150"/>
  <text class="node-title" x="1605" y="522" text-anchor="middle">通知 / Feed</text>
  <text class="node-text" x="1605" y="556" text-anchor="middle">驳回通知</text>
  <text class="node-text" x="1605" y="580" text-anchor="middle">或商品动态推送</text>

  <path class="dash" d="M1620 360 V430 H415 V458"/>
  <text class="step" x="1005" y="414" text-anchor="middle">5. 审核策略通过 RemoteProductService / RemoteShopService 回调源服务</text>

  <path class="pass" d="M580 530 H688"/>
  <text class="step" x="634" y="516" text-anchor="middle">6. PASS 同步索引</text>

  <path class="pass" d="M580 580 H1088"/>
  <text class="step" x="834" y="646" text-anchor="middle">7. PASS 更新热榜 / 计算集合</text>

  <path class="dash" d="M580 555 H1468"/>
  <text class="step" x="1024" y="540" text-anchor="middle">8. 商品 PASS 还会 sendNewProductMessageToMQ 推给粉丝</text>

  <path class="reject" d="M1620 360 V448"/>
  <text class="step" x="1668" y="420">REJECT</text>
  <text class="step" x="1668" y="440">发送系统通知</text>

  <path class="reject" d="M580 605 H688"/>
  <text class="step" x="634" y="690" text-anchor="middle">REJECT 删除 ES / Milvus 索引</text>

  <text class="step" x="1498" y="392">WAITING：保持待审，人工审核页继续处理</text>

  <rect class="note" x="70" y="760" width="500" height="220"/>
  <text class="note-title" x="102" y="806">为什么这张图比通用审核图更有用</text>
  <text class="note-text" x="102" y="846">- 它把“发布”这件事和“审核结果如何改变业务状态”直接连起来了。</text>
  <text class="note-text" x="102" y="876">- 读者不需要先懂完整 audit 模块，也能知道上架、驳回、索引同步各是谁负责。</text>
  <text class="note-text" x="102" y="906">- 很适合放在 README 或 Showcase 做业务闭环说明。</text>

  <rect class="note" x="650" y="760" width="500" height="220"/>
  <text class="note-title" x="682" y="806">你能从代码里对上哪些点</text>
  <text class="note-text" x="682" y="846">- createAuditTask 先落审单，再跑 AuditProcessChain。</text>
  <text class="note-text" x="682" y="876">- PASS 时 product / shop 都会 publish 到 ES 和 Milvus，并更新热榜缓存。</text>
  <text class="note-text" x="682" y="906">- REJECT 时 audit 模块会发系统通知，源服务会做 rejectReason 和删除同步。</text>

  <rect class="note" x="1230" y="760" width="500" height="220"/>
  <text class="note-title" x="1262" y="806">适合补充到文档的阅读语境</text>
  <text class="note-text" x="1262" y="846">- 说明 SmartLive 不是简单 CRUD 后台，而是带审核和检索链路的真实业务系统。</text>
  <text class="note-text" x="1262" y="876">- 也能自然衔接到搜索、AI 检索、Feed 分发这些后续能力。</text>
  <text class="note-text" x="1262" y="906">- 后续补文档时，这张图还能延伸出人工审核工作台说明。</text>
</svg>
