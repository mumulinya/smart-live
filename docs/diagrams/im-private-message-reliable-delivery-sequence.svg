<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id='title'>IM 私聊可靠投递与已读回执链路</title>
  <desc id='desc'>展示私聊消息在 chat 模块落库后经 RabbitMQ 异步分发，再由 IM 模块推送到 Netty 连接并回写消息状态的过程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fbff"/><stop offset="100%" stop-color="#eef5ff"/></linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="#335c9e"/></marker>
    <style>.title{font:700 34px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#16335b}.subtitle{font:500 17px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#486586}.section{font:700 22px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#1f4b82}.node-title{font:700 22px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#12314f}.node-text{font:500 16px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#35506f}.step{font:600 15px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#24476f}.note-title{font:700 19px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#21415d}.note-text{font:500 15px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#506882}.node{fill:#fff;stroke:#9cb9de;stroke-width:2;rx:24}.store{fill:#f1fbf6;stroke:#9fd0b3;stroke-width:2;rx:24}.gateway{fill:#fff6ec;stroke:#f0b37a;stroke-width:2;rx:24}.note{fill:#fff;stroke:#d5e2f3;stroke-width:1.5;rx:20}.line{stroke:#335c9e;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#6d90bf;stroke-width:3;stroke-dasharray:8 8;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1800" height="1040" fill="url(#bg)"/>
  <rect x="34" y="34" width="1732" height="972" rx="30" fill="#ffffff" stroke="#d9e6f5" stroke-width="2"/>
  <text class='title' x='74' y='96'>IM 私聊可靠投递与已读回执链路</text>
  <text class='subtitle' x='74' y='132'>对应代码：ChatListener.consumeAllSessionMessages + SessionChatConsumer.processChatMessage + ImPushConsumer</text>
  <text class='section' x='74' y='188'>1. 消息入库并投递到 Chat MQ</text>
  <rect class='node' x='70' y='220' width='250' height='140'/>
  <text class='node-title' x='195' y='270' text-anchor='middle'>聊天客户端</text>
  <text class='node-text' x='195' y='304' text-anchor='middle'>发送文本消息</text>
  <text class='node-text' x='195' y='328' text-anchor='middle'>携带 sessionId</text>
  <rect class='node' x='390' y='220' width='280' height='140'/>
  <text class='node-title' x='530' y='270' text-anchor='middle'>smartLive-chat</text>
  <text class='node-text' x='530' y='304' text-anchor='middle'>ChatMessages 落库</text>
  <text class='node-text' x='530' y='328' text-anchor='middle'>构建 ChatMessageEvent</text>
  <rect class='gateway' x='740' y='220' width='250' height='140'/>
  <text class='node-title' x='865' y='270' text-anchor='middle'>Chat MQ</text>
  <text class='node-text' x='865' y='304' text-anchor='middle'>CHAT_DIRECT_EXCHANGE</text>
  <text class='node-text' x='865' y='328' text-anchor='middle'>异步解耦</text>
  <rect class='node' x='1060' y='220' width='280' height='140'/>
  <text class='node-title' x='1200' y='270' text-anchor='middle'>ChatListener</text>
  <text class='node-text' x='1200' y='304' text-anchor='middle'>messageId 幂等</text>
  <text class='node-text' x='1200' y='328' text-anchor='middle'>手动 ACK / NACK</text>
  <rect class='store' x='1410' y='220' width='320' height='140'/>
  <text class='node-title' x='1570' y='270' text-anchor='middle'>SessionChatConsumer</text>
  <text class='node-text' x='1570' y='304' text-anchor='middle'>判断在线态</text>
  <text class='node-text' x='1570' y='328' text-anchor='middle'>组装回执事件</text>
  <path class='line' d='M320 290 H378'/>
  <text class='step' x='349' y='194' text-anchor='middle'>1. 发送消息</text>
  <text class='step' x='349' y='214' text-anchor='middle'>进入 chat 服务</text>
  <path class='line' d='M670 290 H728'/>
  <text class='step' x='699' y='194' text-anchor='middle'>2. 落库后投递</text>
  <text class='step' x='699' y='214' text-anchor='middle'>不直接操作长连接</text>
  <path class='line' d='M990 290 H1048'/>
  <text class='step' x='1019' y='194' text-anchor='middle'>3. MQ 幂等</text>
  <text class='step' x='1019' y='214' text-anchor='middle'>重复消息直接跳过</text>
  <path class='line' d='M1340 290 H1398'/>
  <text class='step' x='1369' y='194' text-anchor='middle'>4. 消息消费</text>
  <text class='step' x='1369' y='214' text-anchor='middle'>准备实时推送</text>
  <text class='section' x='74' y='468'>2. 实时推送与已读回执</text>
  <rect class='store' x='90' y='500' width='320' height='140'/>
  <text class='node-title' x='250' y='550' text-anchor='middle'>Redis 在线会话</text>
  <text class='node-text' x='250' y='584' text-anchor='middle'>receiver:activeSession</text>
  <text class='node-text' x='250' y='608' text-anchor='middle'>判断是否在当前窗口</text>
  <rect class='node' x='500' y='500' width='320' height='140'/>
  <text class='node-title' x='660' y='550' text-anchor='middle'>smartLive-im</text>
  <text class='node-text' x='660' y='584' text-anchor='middle'>ImPushConsumer</text>
  <text class='node-text' x='660' y='608' text-anchor='middle'>Netty 集群推送</text>
  <rect class='gateway' x='910' y='500' width='320' height='140'/>
  <text class='node-title' x='1070' y='550' text-anchor='middle'>接收端终端</text>
  <text class='node-text' x='1070' y='584' text-anchor='middle'>在线则实时收到</text>
  <text class='node-text' x='1070' y='608' text-anchor='middle'>离线则保留历史</text>
  <rect class='node' x='1320' y='500' width='340' height='140'/>
  <text class='node-title' x='1490' y='550' text-anchor='middle'>发送方回执</text>
  <text class='node-text' x='1490' y='584' text-anchor='middle'>delivered / read</text>
  <text class='node-text' x='1490' y='608' text-anchor='middle'>未读数和状态更新</text>
  <path class='line' d='M410 570 H488'/>
  <text class='step' x='449' y='474' text-anchor='middle'>5. 查询在线态</text>
  <text class='step' x='449' y='494' text-anchor='middle'>区分已读和已送达</text>
  <path class='line' d='M820 570 H898'/>
  <text class='step' x='859' y='474' text-anchor='middle'>6. 推送到活跃连接</text>
  <text class='step' x='859' y='494' text-anchor='middle'>仅本节点命中才发送</text>
  <path class='line' d='M1230 570 H1308'/>
  <text class='step' x='1269' y='474' text-anchor='middle'>7. 回执通知</text>
  <text class='step' x='1269' y='494' text-anchor='middle'>让发送方感知已读</text>
  <rect class='note' x='70' y='720' width='500' height='220'/>
  <text class='note-title' x='102' y='766'>这张图说明了什么</text>
  <text class='note-text' x='102' y='806'>- 私聊链路把“消息落库”和“实时推送”拆成两个服务，各自职责清晰。</text>
  <text class='note-text' x='102' y='836'>- 如果接收方离线，消息仍然保留在 chat 历史里，不会丢。</text>
  <text class='note-text' x='102' y='866'>- 已读回执不是前端猜的，而是由当前活跃会话状态驱动。</text>
  <rect class='note' x='650' y='720' width='500' height='220'/>
  <text class='note-title' x='682' y='766'>代码里最值得看</text>
  <text class='note-text' x='682' y='806'>- ChatListener 和 ImPushConsumer 都做了 messageId 幂等控制。</text>
  <text class='note-text' x='682' y='836'>- SessionChatConsumer 会根据 Redis 中的 activeSession 判断消息状态。</text>
  <text class='note-text' x='682' y='866'>- 推送层只处理当前节点命中的连接，天然适配集群。</text>
  <rect class='note' x='1230' y='720' width='500' height='220'/>
  <text class='note-title' x='1262' y='766'>文档展示建议</text>
  <text class='note-text' x='1262' y='806'>- 这张图适合配 IM 聊天页截图一起看。</text>
  <text class='note-text' x='1262' y='836'>- 如果面试里讲 IM，这张图可以直接拿来讲可靠投递。</text>
  <text class='note-text' x='1262' y='866'>- 首页只需要挂入口，详情页再放高清图就够了。</text>
</svg>
