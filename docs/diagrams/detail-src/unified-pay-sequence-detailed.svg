<svg xmlns="http://www.w3.org/2000/svg" width="2360" height="1660" viewBox="0 0 2360 1660" role="img" aria-labelledby="title desc">
  <title id="title">统一支付：支付受理、回调与账务分发（详细版）</title>
  <desc id="desc">展示统一支付下单、PaymentRecord 落库、延迟关闭、第三方回调/主动查单、充值与订单支付两条业务分发，以及余额支付的特殊路径。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfcff"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#255792"/>
    </marker>
    <style>
      .title { font: 700 36px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #17365e; }
      .subtitle { font: 500 18px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #4f6d8f; }
      .section { font: 700 24px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #1d4b81; }
      .node-title { font: 700 22px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #153454; }
      .node-text { font: 500 16px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #36516d; }
      .step { font: 600 15px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #25496f; }
      .note-title { font: 700 19px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #23425f; }
      .note-text { font: 500 15px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #506983; }
      .node { fill: #ffffff; stroke: #a8c2e2; stroke-width: 2; rx: 24; }
      .store { fill: #f3fbf5; stroke: #a7d6b7; stroke-width: 2; rx: 24; }
      .mq { fill: #fff6eb; stroke: #f0b884; stroke-width: 2; rx: 24; }
      .decision { fill: #f8f3ff; stroke: #c7a6ea; stroke-width: 2; rx: 24; }
      .note { fill: #ffffff; stroke: #d7e3f4; stroke-width: 1.5; rx: 20; }
      .line { stroke: #255792; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6d92c0; stroke-width: 3; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="2360" height="1660" fill="url(#bg)"/>
  <rect x="28" y="28" width="2304" height="1604" rx="30" fill="#ffffff" stroke="#d9e6f5" stroke-width="2"/>

  <text class="title" x="70" y="92">统一支付：支付受理、回调与账务分发（详细版）</text>
  <text class="subtitle" x="70" y="128">对应代码：PayController + PayServiceImpl.unifiedOrder / queryPayStatus / processCallback + PaymentListener.handlePayTimeout + BalancePayService.pay</text>

  <text class="section" x="70" y="182">1. 统一下单：同一套入口承接充值与订单支付，并复用待支付流水</text>

  <rect class="node" x="70" y="220" width="260" height="180"/>
  <text class="node-title" x="200" y="284" text-anchor="middle">用户端收银台</text>
  <text class="node-text" x="200" y="320" text-anchor="middle">选择 wechat / alipay</text>
  <text class="node-text" x="200" y="346" text-anchor="middle">或直接走 balance</text>

  <rect class="node" x="400" y="220" width="300" height="180"/>
  <text class="node-title" x="550" y="284" text-anchor="middle">PayController</text>
  <text class="node-text" x="550" y="320" text-anchor="middle">/pay/unified</text>
  <text class="node-text" x="550" y="346" text-anchor="middle">/pay/balance</text>

  <rect class="node" x="770" y="220" width="340" height="180"/>
  <text class="node-title" x="940" y="284" text-anchor="middle">PayServiceImpl.unifiedOrder</text>
  <text class="node-text" x="940" y="320" text-anchor="middle">validatePayRequest</text>
  <text class="node-text" x="940" y="346" text-anchor="middle">resolvePayAmount / findPendingRecord</text>

  <rect class="store" x="1180" y="220" width="330" height="180"/>
  <text class="node-title" x="1345" y="284" text-anchor="middle">PaymentRecord</text>
  <text class="node-text" x="1345" y="320" text-anchor="middle">paySn / bizType / bizId / amount</text>
  <text class="node-text" x="1345" y="346" text-anchor="middle">status=PENDING</text>

  <rect class="mq" x="1580" y="220" width="310" height="180"/>
  <text class="node-title" x="1735" y="284" text-anchor="middle">PAY_DELAY_EXCHANGE</text>
  <text class="node-text" x="1735" y="320" text-anchor="middle">recordId 延迟消息</text>
  <text class="node-text" x="1735" y="346" text-anchor="middle">超时自动关闭支付单</text>

  <rect class="decision" x="1960" y="220" width="290" height="180"/>
  <text class="node-title" x="2105" y="284" text-anchor="middle">PaymentStrategyFactory</text>
  <text class="node-text" x="2105" y="320" text-anchor="middle">wechat / alipay / balance</text>
  <text class="node-text" x="2105" y="346" text-anchor="middle">返回支付参数或走余额扣款</text>

  <path class="line" d="M330 310 H388"/>
  <text class="step" x="359" y="292" text-anchor="middle">1. 发起支付</text>
  <path class="line" d="M700 310 H758"/>
  <text class="step" x="729" y="292" text-anchor="middle">2. 入统一入口</text>
  <path class="line" d="M1110 310 H1168"/>
  <text class="step" x="1139" y="292" text-anchor="middle">3. 校验金额与幂等</text>
  <path class="line" d="M1510 310 H1568"/>
  <text class="step" x="1539" y="292" text-anchor="middle">4. 落支付流水</text>
  <path class="line" d="M1890 310 H1948"/>
  <text class="step" x="1919" y="292" text-anchor="middle">5. 选支付策略</text>

  <text class="section" x="70" y="480">2. 第三方回调与主动查单都汇总到 processCallback，再按业务类型分发</text>

  <rect class="node" x="70" y="520" width="320" height="190"/>
  <text class="node-title" x="230" y="586" text-anchor="middle">微信 / 支付宝回调</text>
  <text class="node-text" x="230" y="622" text-anchor="middle">handleWechatCallback</text>
  <text class="node-text" x="230" y="648" text-anchor="middle">handleAlipayCallback</text>

  <rect class="node" x="470" y="520" width="320" height="190"/>
  <text class="node-title" x="630" y="586" text-anchor="middle">主动查单</text>
  <text class="node-text" x="630" y="622" text-anchor="middle">queryPayStatus</text>
  <text class="node-text" x="630" y="648" text-anchor="middle">第三方状态同步回本地</text>

  <rect class="decision" x="870" y="520" width="360" height="190"/>
  <text class="node-title" x="1050" y="586" text-anchor="middle">processCallback</text>
  <text class="node-text" x="1050" y="622" text-anchor="middle">幂等：SUCCESS / CANCELED 直接返回</text>
  <text class="node-text" x="1050" y="648" text-anchor="middle">金额校验后更新支付流水终态</text>

  <rect class="store" x="1310" y="520" width="340" height="190"/>
  <text class="node-title" x="1480" y="586" text-anchor="middle">dispatchBusiness</text>
  <text class="node-text" x="1480" y="622" text-anchor="middle">bizType = recharge</text>
  <text class="node-text" x="1480" y="648" text-anchor="middle">bizType = order</text>

  <rect class="node" x="1730" y="520" width="520" height="190"/>
  <text class="node-title" x="1990" y="586" text-anchor="middle">业务落地</text>
  <text class="node-text" x="1990" y="622" text-anchor="middle">充值：walletService.recharge</text>
  <text class="node-text" x="1990" y="648" text-anchor="middle">订单：recordOrderPayment + remoteOrderService.paySuccess</text>

  <path class="line" d="M390 615 H458"/>
  <text class="step" x="424" y="598" text-anchor="middle">6. 异步回调</text>
  <path class="dash" d="M790 615 H858"/>
  <text class="step" x="824" y="598" text-anchor="middle">7. 轮询查单</text>
  <path class="line" d="M1230 615 H1298"/>
  <text class="step" x="1264" y="598" text-anchor="middle">8. 统一处理回调</text>
  <path class="line" d="M1650 615 H1718"/>
  <text class="step" x="1684" y="598" text-anchor="middle">9. 业务分发</text>

  <text class="section" x="70" y="802">3. 支付超时兜底与余额支付特殊路径</text>

  <rect class="mq" x="70" y="844" width="340" height="190"/>
  <text class="node-title" x="240" y="910" text-anchor="middle">PaymentListener.handlePayTimeout</text>
  <text class="node-text" x="240" y="946" text-anchor="middle">消费 PAY_DELAY_QUEUE</text>
  <text class="node-text" x="240" y="972" text-anchor="middle">status==PENDING 才改为 CANCELED</text>

  <rect class="store" x="490" y="844" width="340" height="190"/>
  <text class="node-title" x="660" y="910" text-anchor="middle">PaymentRecord 终态</text>
  <text class="node-text" x="660" y="946" text-anchor="middle">SUCCESS / FAILED / CANCELED</text>
  <text class="node-text" x="660" y="972" text-anchor="middle">后续轮询直接读本地状态</text>

  <rect class="node" x="910" y="844" width="360" height="190"/>
  <text class="node-title" x="1090" y="910" text-anchor="middle">BalancePayService.pay</text>
  <text class="node-text" x="1090" y="946" text-anchor="middle">直接创建 status=SUCCESS 的流水</text>
  <text class="node-text" x="1090" y="972" text-anchor="middle">walletService.consume 原子扣余额</text>

  <rect class="store" x="1350" y="844" width="340" height="190"/>
  <text class="node-title" x="1520" y="910" text-anchor="middle">余额动账</text>
  <text class="node-text" x="1520" y="946" text-anchor="middle">consume(userId, amount, bizId)</text>
  <text class="node-text" x="1520" y="972" text-anchor="middle">写 WalletTransaction</text>

  <rect class="node" x="1770" y="844" width="480" height="190"/>
  <text class="node-title" x="2010" y="910" text-anchor="middle">订单模块生效</text>
  <text class="node-text" x="2010" y="946" text-anchor="middle">paySuccess(orderId, payType)</text>
  <text class="node-text" x="2010" y="972" text-anchor="middle">status=PAID / payType / 有效期 / 销量</text>

  <path class="line" d="M410 939 H478"/>
  <text class="step" x="444" y="922" text-anchor="middle">10. 超时取消支付单</text>
  <path class="dash" d="M830 939 H898"/>
  <text class="step" x="864" y="922" text-anchor="middle">11. 进入余额支付</text>
  <path class="line" d="M1270 939 H1338"/>
  <text class="step" x="1304" y="922" text-anchor="middle">12. 扣余额</text>
  <path class="line" d="M1690 939 H1758"/>
  <text class="step" x="1724" y="922" text-anchor="middle">13. 订单改为已支付</text>

  <text class="section" x="70" y="1124">4. 这张图补充了统一支付里最容易被漏掉的三个点</text>

  <rect class="note" x="70" y="1166" width="700" height="230"/>
  <text class="note-title" x="102" y="1210">边界 A：回调和主动查单走的是同一套 processCallback</text>
  <text class="note-text" x="102" y="1246">- 微信/支付宝异步通知会进 processCallback。</text>
  <text class="note-text" x="102" y="1274">- 前端轮询 queryPayStatus 发现第三方已支付，也会回到同一套处理流程。</text>
  <text class="note-text" x="102" y="1302">- 这样回调迟到、轮询先到的情况也能落进统一幂等语义里。</text>

  <rect class="note" x="830" y="1166" width="700" height="230"/>
  <text class="note-title" x="862" y="1210">边界 B：充值与订单支付共用支付中枢，但最终落点不同</text>
  <text class="note-text" x="862" y="1246">- recharge：直接给钱包入账。</text>
  <text class="note-text" x="862" y="1274">- order：先记支付流水，再 RPC 通知订单模块 paySuccess。</text>
  <text class="note-text" x="862" y="1302">- 文档里如果只写“统一支付”，很容易把这两条业务分叉讲丢。</text>

  <rect class="note" x="1590" y="1166" width="660" height="230"/>
  <text class="note-title" x="1622" y="1210">代码锚点</text>
  <text class="note-text" x="1622" y="1246">- unifiedOrder：校验、复用 pending 流水、落库、发送 PAY_DELAY。</text>
  <text class="note-text" x="1622" y="1274">- processCallback：幂等、金额校验、状态更新、dispatchBusiness。</text>
  <text class="note-text" x="1622" y="1302">- PaymentListener：支付单超时自动取消。</text>
  <text class="note-text" x="1622" y="1330">- BalancePayService：站内余额支付直接落成功流水并同步订单状态。</text>
</svg>
