<svg xmlns="http://www.w3.org/2000/svg" width="2360" height="1560" viewBox="0 0 2360 1560" role="img" aria-labelledby="title desc">
  <title id="title">每日签到积分（详细版）</title>
  <desc id="desc">展示积分钱包初始化、今日是否已签到校验、连续签到计算、7 天翻倍规则、钱包更新与积分流水落库的完整流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfcff"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#255792"/>
    </marker>
    <style>
      .title { font: 700 36px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #17365e; }
      .subtitle { font: 500 18px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #4f6d8f; }
      .section { font: 700 24px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #1d4b81; }
      .node-title { font: 700 22px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #153454; }
      .node-text { font: 500 16px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #36516d; }
      .step { font: 600 15px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #25496f; }
      .note-title { font: 700 19px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #23425f; }
      .note-text { font: 500 15px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #506983; }
      .node { fill: #ffffff; stroke: #a8c2e2; stroke-width: 2; rx: 24; }
      .store { fill: #f3fbf5; stroke: #a7d6b7; stroke-width: 2; rx: 24; }
      .decision { fill: #f8f3ff; stroke: #c7a6ea; stroke-width: 2; rx: 24; }
      .danger { fill: #fff4f4; stroke: #e5a7a7; stroke-width: 2; rx: 24; }
      .note { fill: #ffffff; stroke: #d7e3f4; stroke-width: 1.5; rx: 20; }
      .line { stroke: #255792; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6d92c0; stroke-width: 3; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
      .pass { stroke: #2b8c61; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .reject { stroke: #c15a5a; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="2360" height="1560" fill="url(#bg)"/>
  <rect x="28" y="28" width="2304" height="1504" rx="30" fill="#ffffff" stroke="#d9e6f5" stroke-width="2"/>

  <text class="title" x="70" y="92">每日签到积分（详细版）</text>
  <text class="subtitle" x="70" y="128">对应代码：PointsServiceImpl.getWalletInfo / signIn / insertRecord + UserPointsWallet / DailySignIn / PointsRecord</text>

  <text class="section" x="70" y="182">1. 进入积分中心时，先查询或初始化积分钱包</text>

  <rect class="node" x="70" y="220" width="270" height="170"/>
  <text class="node-title" x="205" y="282" text-anchor="middle">用户端 App</text>
  <text class="node-text" x="205" y="318" text-anchor="middle">积分中心首页</text>
  <text class="node-text" x="205" y="344" text-anchor="middle">先查钱包信息，再发起签到</text>

  <rect class="node" x="410" y="220" width="380" height="170"/>
  <text class="node-title" x="600" y="282" text-anchor="middle">PointsController / getWalletInfo</text>
  <text class="node-text" x="600" y="318" text-anchor="middle">查询余额、等级、连续签到天数</text>
  <text class="node-text" x="600" y="344" text-anchor="middle">并判断今天是否已签到</text>

  <rect class="store" x="860" y="220" width="430" height="170"/>
  <text class="node-title" x="1075" y="282" text-anchor="middle">UserPointsWallet</text>
  <text class="node-text" x="1075" y="318" text-anchor="middle">getOrCreateWallet(userId)</text>
  <text class="node-text" x="1075" y="344" text-anchor="middle">不存在则初始化 balance / totalEarned / lastSignDate</text>

  <rect class="decision" x="1360" y="220" width="420" height="170"/>
  <text class="node-title" x="1570" y="282" text-anchor="middle">等级与展示信息</text>
  <text class="node-text" x="1570" y="318" text-anchor="middle">按 totalEarned 计算 普通 / 银卡 / 金卡 / 钻石 / 至尊</text>
  <text class="node-text" x="1570" y="344" text-anchor="middle">计算进度条、下一等级差值、权益列表</text>

  <rect class="store" x="1850" y="220" width="430" height="170"/>
  <text class="node-title" x="2065" y="282" text-anchor="middle">WalletInfoVO</text>
  <text class="node-text" x="2065" y="318" text-anchor="middle">balance / totalEarned / levelName</text>
  <text class="node-text" x="2065" y="344" text-anchor="middle">signedIn / consecutiveDays / benefits</text>

  <path class="line" d="M340 305 H398"/>
  <text class="step" x="369" y="289" text-anchor="middle">1. 进入积分页</text>
  <path class="line" d="M790 305 H848"/>
  <text class="step" x="819" y="289" text-anchor="middle">2. 查钱包</text>
  <path class="line" d="M1290 305 H1348"/>
  <text class="step" x="1319" y="289" text-anchor="middle">3. 计算等级</text>
  <path class="line" d="M1780 305 H1838"/>
  <text class="step" x="1809" y="289" text-anchor="middle">4. 返回首页数据</text>

  <text class="section" x="70" y="462">2. 签到链路：今日未签到才能新增记录，并按连续天数发放积分</text>

  <rect class="node" x="90" y="500" width="360" height="190"/>
  <text class="node-title" x="270" y="562" text-anchor="middle">PointsServiceImpl.signIn</text>
  <text class="node-text" x="270" y="598" text-anchor="middle">读取 today / yesterday</text>
  <text class="node-text" x="270" y="624" text-anchor="middle">重新获取钱包，确保使用最新 lastSignDate</text>
  <text class="node-text" x="270" y="650" text-anchor="middle">校验“今天是否已签到”</text>

  <rect class="decision" x="540" y="500" width="360" height="190"/>
  <text class="node-title" x="720" y="562" text-anchor="middle">连续签到计算</text>
  <text class="node-text" x="720" y="598" text-anchor="middle">昨天已签 -&gt; consecutiveDays + 1</text>
  <text class="node-text" x="720" y="624" text-anchor="middle">中断 -&gt; consecutiveDays = 1</text>
  <text class="node-text" x="720" y="650" text-anchor="middle">每满 7 天，积分从 10 翻倍到 20</text>

  <rect class="store" x="990" y="500" width="360" height="190"/>
  <text class="node-title" x="1170" y="562" text-anchor="middle">DailySignIn</text>
  <text class="node-text" x="1170" y="598" text-anchor="middle">插入 signDate / points / consecutiveDays</text>
  <text class="node-text" x="1170" y="624" text-anchor="middle">形成每天一条签到记录</text>
  <text class="node-text" x="1170" y="650" text-anchor="middle">用于后续活动展示与追溯</text>

  <rect class="store" x="1440" y="500" width="360" height="190"/>
  <text class="node-title" x="1620" y="562" text-anchor="middle">UserPointsWallet 更新</text>
  <text class="node-text" x="1620" y="598" text-anchor="middle">balance += points</text>
  <text class="node-text" x="1620" y="624" text-anchor="middle">totalEarned += points</text>
  <text class="node-text" x="1620" y="650" text-anchor="middle">lastSignDate / consecutiveDays 同步更新</text>

  <rect class="store" x="1890" y="500" width="390" height="190"/>
  <text class="node-title" x="2085" y="562" text-anchor="middle">PointsRecord</text>
  <text class="node-text" x="2085" y="598" text-anchor="middle">type=1, bizType=1</text>
  <text class="node-text" x="2085" y="624" text-anchor="middle">amount=签到奖励积分</text>
  <text class="node-text" x="2085" y="650" text-anchor="middle">description=每日签到奖励</text>

  <path class="line" d="M450 595 H528"/>
  <text class="step" x="489" y="579" text-anchor="middle">5. 校验今日是否已签</text>
  <path class="line" d="M900 595 H978"/>
  <text class="step" x="939" y="579" text-anchor="middle">6. 计算连续天数与积分</text>
  <path class="line" d="M1350 595 H1428"/>
  <text class="step" x="1389" y="579" text-anchor="middle">7. 插入签到记录</text>
  <path class="line" d="M1800 595 H1878"/>
  <text class="step" x="1839" y="579" text-anchor="middle">8. 更新钱包并记流水</text>

  <text class="section" x="70" y="754">3. 异常与回显：已签到直接报错；成功后前端再查钱包和流水</text>

  <rect class="danger" x="120" y="792" width="480" height="190"/>
  <text class="node-title" x="360" y="854" text-anchor="middle">今日已签到分支</text>
  <text class="node-text" x="360" y="890" text-anchor="middle">today.equals(wallet.lastSignDate)</text>
  <text class="node-text" x="360" y="916" text-anchor="middle">抛 BusinessException：今日已签到，请明天再来</text>
  <text class="node-text" x="360" y="942" text-anchor="middle">不会重复插入 DailySignIn 和 PointsRecord</text>

  <rect class="decision" x="760" y="792" width="470" height="190"/>
  <text class="node-title" x="995" y="854" text-anchor="middle">签到成功返回</text>
  <text class="node-text" x="995" y="890" text-anchor="middle">points</text>
  <text class="node-text" x="995" y="916" text-anchor="middle">consecutiveDays</text>
  <text class="node-text" x="995" y="942" text-anchor="middle">前端据此播放签到成功动画</text>

  <rect class="node" x="1390" y="792" width="410" height="190"/>
  <text class="node-title" x="1595" y="854" text-anchor="middle">记录页 / 钱包页</text>
  <text class="node-text" x="1595" y="890" text-anchor="middle">getRecordList 分页查 PointsRecord</text>
  <text class="node-text" x="1595" y="916" text-anchor="middle">再次 getWalletInfo 获取最新余额与等级</text>
  <text class="node-text" x="1595" y="942" text-anchor="middle">签到状态马上反映到 UI</text>

  <rect class="store" x="1960" y="792" width="320" height="190"/>
  <text class="node-title" x="2120" y="854" text-anchor="middle">前端最终效果</text>
  <text class="node-text" x="2120" y="890" text-anchor="middle">已签到状态</text>
  <text class="node-text" x="2120" y="916" text-anchor="middle">余额增加</text>
  <text class="node-text" x="2120" y="942" text-anchor="middle">连续签到天数刷新</text>

  <path class="reject" d="M270 690 V770"/>
  <text class="step" x="298" y="742">9. 已签到则直接返回异常</text>
  <path class="pass" d="M2085 690 V750 H995 V780"/>
  <text class="step" x="1540" y="734" text-anchor="middle">10. 成功后返回签到结果</text>
  <path class="line" d="M1230 887 H1378"/>
  <text class="step" x="1304" y="871" text-anchor="middle">11. 再查钱包与流水</text>
  <path class="dash" d="M1800 887 H1948"/>
  <text class="step" x="1874" y="871" text-anchor="middle">12. 页面刷新展示</text>

  <text class="section" x="70" y="1062">4. 这张详细图补了两个容易被忽略的业务点</text>

  <rect class="note" x="70" y="1100" width="700" height="170"/>
  <text class="note-title" x="102" y="1142">补充 A：签到不只是“加积分”</text>
  <text class="note-text" x="102" y="1172">- DailySignIn 保存每天一条签到事实，方便后面做日历、活动、连续签到奖励。</text>
  <text class="note-text" x="102" y="1200">- UserPointsWallet 保存聚合态，前端读首页不需要每次统计签到明细。</text>
  <text class="note-text" x="102" y="1228">- PointsRecord 再负责流水追溯，所以这条链有三份数据，各自职责不同。</text>

  <rect class="note" x="830" y="1100" width="700" height="170"/>
  <text class="note-title" x="862" y="1142">补充 B：连续 7 天翻倍规则是落在服务端里的</text>
  <text class="note-text" x="862" y="1172">- 基础积分固定是 10，只有 consecutiveDays % 7 == 0 时翻倍到 20。</text>
  <text class="note-text" x="862" y="1200">- 这保证前端只是展示结果，不自己参与签到积分计算。</text>
  <text class="note-text" x="862" y="1228">- 所以后续改奖励规则，只动 PointsServiceImpl 就够了。</text>

  <rect class="note" x="1590" y="1100" width="700" height="170"/>
  <text class="note-title" x="1622" y="1142">代码锚点</text>
  <text class="note-text" x="1622" y="1172">- getWalletInfo：初始化钱包、计算等级进度和今日是否已签到。</text>
  <text class="note-text" x="1622" y="1200">- signIn：校验 lastSignDate、计算连续天数、写 DailySignIn、更新 Wallet、插入 PointsRecord。</text>
  <text class="note-text" x="1622" y="1228">- getRecordList：分页回查流水，支撑前端积分明细页。</text>
</svg>
