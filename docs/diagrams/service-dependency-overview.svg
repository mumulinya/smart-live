<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">SmartLive 服务依赖关系总览</title>
  <desc id="desc">展示用户端与管理端通过网关进入各业务服务簇，并依赖 MySQL、Redis、RabbitMQ、Elasticsearch、Milvus、MinIO、Nacos、XXL-JOB 等基础设施。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="cardGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#effcf6"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="cardOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="cardPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <linearGradient id="cardTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5372a8"/>
    </marker>
    <style>
      .panel { fill: url(#bg); stroke: #d5e3ff; stroke-width: 2; }
      .card { stroke-width: 2; rx: 28; ry: 28; }
      .title { font: 700 34px 'Segoe UI', 'PingFang SC', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px 'Segoe UI', 'PingFang SC', sans-serif; fill: #334155; }
      .group-title { font: 700 24px 'Segoe UI', 'PingFang SC', sans-serif; fill: #0f172a; }
      .group-text { font: 400 15px 'Segoe UI', 'PingFang SC', sans-serif; fill: #334155; }
      .small { font: 400 14px 'Segoe UI', 'PingFang SC', sans-serif; fill: #475569; }
      .infra-title { font: 700 21px 'Segoe UI', 'PingFang SC', sans-serif; fill: #0f172a; }
      .infra-text { font: 400 14px 'Segoe UI', 'PingFang SC', sans-serif; fill: #475569; }
      .label { font: 700 13px 'Segoe UI', 'PingFang SC', sans-serif; fill: #1d4ed8; letter-spacing: 0.06em; }
      .arrow { stroke: #5372a8; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7c93bf; stroke-width: 2.5; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="16" y="16" width="1568" height="948" rx="30" ry="30" class="panel"/>

  <text x="800" y="72" text-anchor="middle" class="title">SmartLive 服务依赖关系总览</text>
  <text x="800" y="103" text-anchor="middle" class="subtitle">先看入口层，再看业务服务簇，最后看基础设施承载的职责边界</text>

  <text x="82" y="160" class="label">ENTRY</text>
  <rect x="60" y="174" width="260" height="122" class="card" fill="url(#cardBlue)" stroke="#93c5fd"/>
  <text x="190" y="224" text-anchor="middle" class="group-title">用户端 App / 管理端 Web</text>
  <text x="190" y="256" text-anchor="middle" class="group-text">统一从移动端和后台进入业务链路</text>

  <text x="390" y="160" class="label">GATEWAY</text>
  <rect x="368" y="174" width="252" height="122" class="card" fill="url(#cardBlue)" stroke="#60a5fa"/>
  <text x="494" y="224" text-anchor="middle" class="group-title">smartLive-gateway</text>
  <text x="494" y="252" text-anchor="middle" class="group-text">统一入口、鉴权、XSS、防刷与路由转发</text>

  <text x="688" y="160" class="label">AUTH</text>
  <rect x="666" y="174" width="244" height="122" class="card" fill="url(#cardBlue)" stroke="#3b82f6"/>
  <text x="788" y="224" text-anchor="middle" class="group-title">smartLive-auth</text>
  <text x="788" y="252" text-anchor="middle" class="group-text">登录认证、Token 签发、黑名单校验</text>

  <line x1="320" y1="235" x2="368" y2="235" class="arrow"/>
  <line x1="620" y1="235" x2="666" y2="235" class="arrow"/>

  <text x="82" y="370" class="label">SERVICE CLUSTERS</text>

  <rect x="60" y="392" width="330" height="182" class="card" fill="url(#cardGreen)" stroke="#34d399"/>
  <text x="225" y="440" text-anchor="middle" class="group-title">基础服务簇</text>
  <text x="225" y="475" text-anchor="middle" class="group-text">system / user / file</text>
  <text x="225" y="510" text-anchor="middle" class="group-text">用户资料、系统配置、文件上传、头像替换</text>
  <text x="225" y="542" text-anchor="middle" class="small">user 会发审核 / ES 同步 MQ，file 模块会直接依赖 MinIO 做对象存储</text>

  <rect x="430" y="392" width="350" height="182" class="card" fill="url(#cardOrange)" stroke="#fb923c"/>
  <text x="605" y="440" text-anchor="middle" class="group-title">交易履约服务簇</text>
  <text x="605" y="475" text-anchor="middle" class="group-text">shop / product / order / wallet / points</text>
  <text x="605" y="510" text-anchor="middle" class="group-text">店铺、商品、下单、支付、退款、积分与抽奖</text>
  <text x="605" y="542" text-anchor="middle" class="small">强依赖 Redis、RabbitMQ 与 XXL-JOB 保证状态流转与补偿收敛</text>

  <rect x="820" y="392" width="350" height="182" class="card" fill="url(#cardPurple)" stroke="#c084fc"/>
  <text x="995" y="440" text-anchor="middle" class="group-title">内容社交服务簇</text>
  <text x="995" y="475" text-anchor="middle" class="group-text">blog / interaction / chat / im</text>
  <text x="995" y="510" text-anchor="middle" class="group-text">博客、点赞收藏、关注 Feed、系统通知、私聊推送</text>
  <text x="995" y="542" text-anchor="middle" class="small">interaction 同时依赖 XXL-JOB 做互动回刷与热榜重建调度</text>

  <rect x="1210" y="392" width="330" height="182" class="card" fill="url(#cardTeal)" stroke="#2dd4bf"/>
  <text x="1375" y="440" text-anchor="middle" class="group-title">搜索智能治理簇</text>
  <text x="1375" y="475" text-anchor="middle" class="group-text">search / ai / audit / index</text>
  <text x="1375" y="510" text-anchor="middle" class="group-text">搜索、RAG、审核责任链、首页聚合与热榜入口</text>
  <text x="1375" y="542" text-anchor="middle" class="small">围绕 ES、Milvus、审核中台与首页聚合做查询侧增强</text>

  <line x1="788" y1="296" x2="225" y2="392" class="dash"/>
  <line x1="788" y1="296" x2="605" y2="392" class="dash"/>
  <line x1="788" y1="296" x2="995" y2="392" class="dash"/>
  <line x1="788" y1="296" x2="1375" y2="392" class="dash"/>

  <text x="82" y="650" class="label">INFRASTRUCTURE</text>

  <rect x="60" y="674" width="250" height="120" class="card" fill="url(#cardBlue)" stroke="#93c5fd"/>
  <text x="185" y="718" text-anchor="middle" class="infra-title">MySQL</text>
  <text x="185" y="748" text-anchor="middle" class="infra-text">系统主数据、订单、支付、审核、聊天等源数据</text>

  <rect x="340" y="674" width="250" height="120" class="card" fill="url(#cardBlue)" stroke="#60a5fa"/>
  <text x="465" y="718" text-anchor="middle" class="infra-title">Redis</text>
  <text x="465" y="748" text-anchor="middle" class="infra-text">分层缓存、热点榜单、Feed、分布式锁、幂等键</text>

  <rect x="620" y="674" width="270" height="120" class="card" fill="url(#cardOrange)" stroke="#fb923c"/>
  <text x="755" y="718" text-anchor="middle" class="infra-title">RabbitMQ</text>
  <text x="755" y="748" text-anchor="middle" class="infra-text">异步解耦、延迟取消、死信补偿、ES / Milvus 同步</text>

  <rect x="920" y="674" width="280" height="120" class="card" fill="url(#cardTeal)" stroke="#2dd4bf"/>
  <text x="1060" y="710" text-anchor="middle" class="infra-title">Elasticsearch / Milvus / MinIO</text>
  <text x="1060" y="744" text-anchor="middle" class="infra-text">搜索索引、向量检索、对象存储与 RAG 资料承载</text>

  <rect x="1230" y="674" width="310" height="120" class="card" fill="url(#cardPurple)" stroke="#a855f7"/>
  <text x="1385" y="710" text-anchor="middle" class="infra-title">Nacos / XXL-JOB / Sentinel / Seata</text>
  <text x="1385" y="744" text-anchor="middle" class="infra-text">注册配置、调度兜底、流量治理与分布式事务支撑</text>

  <line x1="225" y1="574" x2="185" y2="674" class="arrow"/>
  <line x1="225" y1="574" x2="465" y2="674" class="arrow"/>
  <line x1="235" y1="574" x2="735" y2="674" class="arrow"/>
  <line x1="245" y1="574" x2="1020" y2="674" class="arrow"/>
  <line x1="605" y1="574" x2="465" y2="674" class="arrow"/>
  <line x1="605" y1="574" x2="755" y2="674" class="arrow"/>
  <line x1="605" y1="574" x2="1385" y2="674" class="arrow"/>
  <line x1="995" y1="574" x2="465" y2="674" class="arrow"/>
  <line x1="995" y1="574" x2="755" y2="674" class="arrow"/>
  <line x1="1015" y1="574" x2="1365" y2="674" class="arrow"/>
  <line x1="1375" y1="574" x2="1060" y2="674" class="arrow"/>
  <line x1="1375" y1="574" x2="755" y2="674" class="arrow"/>
  <line x1="1375" y1="574" x2="1385" y2="674" class="arrow"/>

  <rect x="60" y="832" width="1480" height="92" rx="22" ry="22" fill="#ffffff" stroke="#d5e3ff" stroke-width="2"/>
  <text x="800" y="870" text-anchor="middle" class="group-title">怎么读这张图</text>
  <text x="800" y="902" text-anchor="middle" class="group-text">先把 Gateway / Auth 当成统一入口，再按业务簇看职责边界，最后理解基础设施为什么会同时出现在多条链路里。</text>
</svg>
