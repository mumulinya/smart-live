<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FBFF"/>
      <stop offset="1" stop-color="#EEF6FF"/>
    </linearGradient>
    <linearGradient id="titleBar" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8ECFF"/>
      <stop offset="1" stop-color="#F7FBFF"/>
    </linearGradient>
    <filter id="shadow" x="-40" y="-40" width="1680" height="1060" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#A9C8F2" flood-opacity="0.22"/>
    </filter>
    <filter id="cardShadow" x="0" y="0" width="1600" height="980" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#B7CAE6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="980" rx="32" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="28" y="24" width="1544" height="932" rx="28" fill="#FFFFFF"/>
  </g>

  <rect x="60" y="56" width="1480" height="112" rx="22" fill="url(#titleBar)" stroke="#D9EAFE"/>
  <rect x="88" y="83" width="8" height="58" rx="4" fill="#49A9F8"/>
  <text x="116" y="108" font-size="40" font-weight="700" fill="#1E293B" font-family="Segoe UI, Microsoft YaHei, Arial">SmartLive 项目演进时间线（6 个月）</text>
  <text x="116" y="144" font-size="18" fill="#607089" font-family="Segoe UI, Microsoft YaHei, Arial">从教学起点到平台级版本，重点展示每个月最关键的建设目标与能力跃迁。</text>

  <rect x="80" y="204" width="1440" height="84" rx="20" fill="#F8FBFF" stroke="#DCEAFE"/>
  <text x="112" y="238" font-size="22" font-weight="700" fill="#1F3B63" font-family="Segoe UI, Microsoft YaHei, Arial">读图方式</text>
  <text x="112" y="270" font-size="18" fill="#55657E" font-family="Segoe UI, Microsoft YaHei, Arial">左到右表示时间推进；每张卡片分为“当月主建设目标”和“现在最值得怎么讲”两部分，适合直接拿去面试复述。</text>

  <line x1="180" y1="510" x2="1420" y2="510" stroke="#9EC5FF" stroke-width="8" stroke-linecap="round"/>

  <!-- Month markers -->
  <circle cx="220" cy="510" r="18" fill="#4EA8FF"/>
  <circle cx="460" cy="510" r="18" fill="#4EA8FF"/>
  <circle cx="700" cy="510" r="18" fill="#4EA8FF"/>
  <circle cx="940" cy="510" r="18" fill="#4EA8FF"/>
  <circle cx="1180" cy="510" r="18" fill="#4EA8FF"/>
  <circle cx="1420" cy="510" r="18" fill="#4EA8FF"/>

  <!-- Cards -->
  <g filter="url(#cardShadow)">
    <rect x="90" y="324" width="260" height="220" rx="22" fill="#FFFFFF" stroke="#CFE1FF"/>
    <rect x="90" y="324" width="260" height="56" rx="22" fill="#EAF5FF"/>
    <text x="114" y="358" font-size="26" font-weight="700" fill="#1F3B63" font-family="Segoe UI, Microsoft YaHei, Arial">第 1 月 · 2025.10</text>
    <text x="114" y="410" font-size="18" fill="#344054" font-family="Segoe UI, Microsoft YaHei, Arial">• 登录、首页、地图、搜索</text>
    <text x="114" y="440" font-size="18" fill="#344054" font-family="Segoe UI, Microsoft YaHei, Arial">• 私信与 AI 评论 / 下单雏形</text>
    <rect x="110" y="470" width="220" height="52" rx="16" fill="#F5FAFF" stroke="#D9EAFE"/>
    <text x="126" y="500" font-size="16" fill="#4C5F7A" font-family="Segoe UI, Microsoft YaHei, Arial">现在最值得讲：</text>
    <text x="126" y="520" font-size="16" fill="#1677FF" font-family="Segoe UI, Microsoft YaHei, Arial">先把用户主链路搭起来</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="330" y="596" width="260" height="220" rx="22" fill="#FFFFFF" stroke="#CFE1FF"/>
    <rect x="330" y="596" width="260" height="56" rx="22" fill="#EEF9F2"/>
    <text x="354" y="630" font-size="26" font-weight="700" fill="#1F3B63" font-family="Segoe UI, Microsoft YaHei, Arial">第 2 月 · 2025.11</text>
    <text x="354" y="682" font-size="18" fill="#344054" font-family="Segoe UI, Microsoft YaHei, Arial">• RabbitMQ、死信队列、线程池</text>
    <text x="354" y="712" font-size="18" fill="#344054" font-family="Segoe UI, Microsoft YaHei, Arial">• ES 同步与首页聚合能力</text>
    <rect x="350" y="742" width="220" height="52" rx="16" fill="#F5FAFF" stroke="#D9EAFE"/>
    <text x="366" y="772" font-size="16" fill="#4C5F7A" font-family="Segoe UI, Microsoft YaHei, Arial">现在最值得讲：</text>
    <text x="366" y="792" font-size="16" fill="#16A34A" font-family="Segoe UI, Microsoft YaHei, Arial">从能跑走向能异步解耦</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="570" y="324" width="260" height="220" rx="22" fill="#FFFFFF" stroke="#CFE1FF"/>
    <rect x="570" y="324" width="260" height="56" rx="22" fill="#FFF6E9"/>
    <text x="594" y="358" font-size="26" font-weight="700" fill="#1F3B63" font-family="Segoe UI, Microsoft YaHei, Arial">第 3 月 · 2025.12</text>
    <text x="594" y="410" font-size="18" fill="#344054" font-family="Segoe UI, Microsoft YaHei, Arial">• 互动域拆分与策略模式</text>
    <text x="594" y="440" font-size="18" fill="#344054" font-family="Segoe UI, Microsoft YaHei, Arial">• 升级 Boot 3.2.2，AI 并回主仓库</text>
    <rect x="590" y="470" width="220" height="52" rx="16" fill="#F5FAFF" stroke="#D9EAFE"/>
    <text x="606" y="500" font-size="16" fill="#4C5F7A" font-family="Segoe UI, Microsoft YaHei, Arial">现在最值得讲：</text>
    <text x="606" y="520" font-size="16" fill="#D97706" font-family="Segoe UI, Microsoft YaHei, Arial">开始做结构化抽象</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="810" y="596" width="260" height="220" rx="22" fill="#FFFFFF" stroke="#CFE1FF"/>
    <rect x="810" y="596" width="260" height="56" rx="22" fill="#F3EEFF"/>
    <text x="834" y="630" font-size="26" font-weight="700" fill="#1F3B63" font-family="Segoe UI, Microsoft YaHei, Arial">第 4 月 · 2026.01</text>
    <text x="834" y="682" font-size="18" fill="#344054" font-family="Segoe UI, Microsoft YaHei, Arial">• Netty IM 重构</text>
    <text x="834" y="712" font-size="18" fill="#344054" font-family="Segoe UI, Microsoft YaHei, Arial">• 订单、代金券、审核中心初版</text>
    <rect x="830" y="742" width="220" height="52" rx="16" fill="#F5FAFF" stroke="#D9EAFE"/>
    <text x="846" y="772" font-size="16" fill="#4C5F7A" font-family="Segoe UI, Microsoft YaHei, Arial">现在最值得讲：</text>
    <text x="846" y="792" font-size="16" fill="#7C3AED" font-family="Segoe UI, Microsoft YaHei, Arial">开始收束服务骨架</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="1050" y="324" width="260" height="220" rx="22" fill="#FFFFFF" stroke="#CFE1FF"/>
    <rect x="1050" y="324" width="260" height="56" rx="22" fill="#EAFBF5"/>
    <text x="1074" y="358" font-size="26" font-weight="700" fill="#1F3B63" font-family="Segoe UI, Microsoft YaHei, Arial">第 5 月 · 2026.02</text>
    <text x="1074" y="410" font-size="18" fill="#344054" font-family="Segoe UI, Microsoft YaHei, Arial">• AI 会话、审核链、缓存重构</text>
    <text x="1074" y="440" font-size="18" fill="#344054" font-family="Segoe UI, Microsoft YaHei, Arial">• 评论评价、XXL-JOB、热榜搜索优化</text>
    <rect x="1070" y="470" width="220" height="52" rx="16" fill="#F5FAFF" stroke="#D9EAFE"/>
    <text x="1086" y="500" font-size="16" fill="#4C5F7A" font-family="Segoe UI, Microsoft YaHei, Arial">现在最值得讲：</text>
    <text x="1086" y="520" font-size="16" fill="#059669" font-family="Segoe UI, Microsoft YaHei, Arial">形成多链路协同系统</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="1290" y="596" width="260" height="220" rx="22" fill="#FFFFFF" stroke="#CFE1FF"/>
    <rect x="1290" y="596" width="260" height="56" rx="22" fill="#FFF0F0"/>
    <text x="1314" y="630" font-size="26" font-weight="700" fill="#1F3B63" font-family="Segoe UI, Microsoft YaHei, Arial">第 6 月 · 2026.03</text>
    <text x="1314" y="682" font-size="18" fill="#344054" font-family="Segoe UI, Microsoft YaHei, Arial">• 自动退款、MQ 幂等与补偿</text>
    <text x="1314" y="712" font-size="18" fill="#344054" font-family="Segoe UI, Microsoft YaHei, Arial">• 商家 AI 助手与完整文档站</text>
    <rect x="1310" y="742" width="220" height="52" rx="16" fill="#F5FAFF" stroke="#D9EAFE"/>
    <text x="1326" y="772" font-size="16" fill="#4C5F7A" font-family="Segoe UI, Microsoft YaHei, Arial">现在最值得讲：</text>
    <text x="1326" y="792" font-size="16" fill="#DC2626" font-family="Segoe UI, Microsoft YaHei, Arial">从能做完到能讲清楚</text>
  </g>

  <!-- connectors -->
  <line x1="220" y1="510" x2="220" y2="544" stroke="#9EC5FF" stroke-width="4"/>
  <line x1="460" y1="510" x2="460" y2="596" stroke="#9EC5FF" stroke-width="4"/>
  <line x1="700" y1="510" x2="700" y2="544" stroke="#9EC5FF" stroke-width="4"/>
  <line x1="940" y1="510" x2="940" y2="596" stroke="#9EC5FF" stroke-width="4"/>
  <line x1="1180" y1="510" x2="1180" y2="544" stroke="#9EC5FF" stroke-width="4"/>
  <line x1="1420" y1="510" x2="1420" y2="596" stroke="#9EC5FF" stroke-width="4"/>

  <!-- Summary cards -->
  <rect x="88" y="860" width="1424" height="72" rx="18" fill="#F8FBFF" stroke="#D9EAFE"/>
  <text x="120" y="904" font-size="20" font-weight="700" fill="#1F3B63" font-family="Segoe UI, Microsoft YaHei, Arial">一句话总结：</text>
  <text x="252" y="904" font-size="20" fill="#4C5F7A" font-family="Segoe UI, Microsoft YaHei, Arial">前 2 个月搭主链和中间件底座，中间 2 个月做边界拆分和结构抽象，最后 2 个月补齐 AI、补偿、治理和文档资产。</text>
</svg>
