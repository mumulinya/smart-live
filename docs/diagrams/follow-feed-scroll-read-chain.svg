<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">关注 Feed 推送与滚动读取链路</title>
  <desc id="desc">展示 FeedEventMessage 写入粉丝信箱、Redis ZSet 批量推送，以及 ScrollResult 读链路的过程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfcff"/>
      <stop offset="100%" stop-color="#f3f8ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2d5d9f"/>
    </marker>
    <style>
      .title { font: 700 34px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #17365e; }
      .subtitle { font: 500 17px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #4b6988; }
      .section { font: 700 22px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #1d4b81; }
      .node-title { font: 700 22px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #143250; }
      .node-text { font: 500 16px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #35516e; }
      .label { font: 600 15px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #24486f; }
      .note-title { font: 700 18px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #23425f; }
      .note-text { font: 500 15px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #506983; }
      .node { fill: #ffffff; stroke: #a2bcdd; stroke-width: 2; rx: 24; }
      .mq { fill: #fff6eb; stroke: #efb882; stroke-width: 2; rx: 24; }
      .store { fill: #f2fbf5; stroke: #a6d5b6; stroke-width: 2; rx: 24; }
      .note { fill: #ffffff; stroke: #d7e3f4; stroke-width: 1.5; rx: 20; }
      .line { stroke: #2d5d9f; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6d90bf; stroke-width: 3; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="960" fill="url(#bg)"/>
  <rect x="36" y="36" width="1528" height="888" rx="28" fill="#ffffff" stroke="#d9e6f5" stroke-width="2"/>

  <text class="title" x="76" y="96">关注 Feed 推送与滚动读取链路</text>
  <text class="subtitle" x="76" y="132">对应代码：FollowListener.handleSendNormalToFollowers + FollowServiceImpl.pushToFollowers + feedServiceImpl.queryFeedList</text>

  <text class="section" x="76" y="188">1. 写入路径：发布事件推到粉丝信箱</text>

  <rect class="node" x="76" y="224" width="236" height="116"/>
  <text class="node-title" x="194" y="270" text-anchor="middle">商品 / 店铺发布</text>
  <text class="node-text" x="194" y="298" text-anchor="middle">构建 FeedEventMessage</text>

  <rect class="mq" x="364" y="224" width="220" height="116"/>
  <text class="node-title" x="474" y="270" text-anchor="middle">Feed MQ</text>
  <text class="node-text" x="474" y="298" text-anchor="middle">INTERACT_FEED_EXCHANGE</text>

  <rect class="node" x="636" y="224" width="254" height="116"/>
  <text class="node-title" x="763" y="270" text-anchor="middle">FollowListener</text>
  <text class="node-text" x="763" y="298" text-anchor="middle">messageId 幂等消费 + 重试</text>

  <rect class="store" x="942" y="224" width="248" height="116"/>
  <text class="node-title" x="1066" y="270" text-anchor="middle">粉丝集合</text>
  <text class="node-text" x="1066" y="298" text-anchor="middle">Redis ZSet，必要时 DB 兜底</text>

  <rect class="store" x="1242" y="224" width="280" height="116"/>
  <text class="node-title" x="1382" y="270" text-anchor="middle">用户 Feed ZSet</text>
  <text class="node-text" x="1382" y="298" text-anchor="middle">个人 feed + all feed 批量写入</text>

  <path class="line" d="M312 266 H352"/>
  <text class="label" x="332" y="252" text-anchor="middle">1. 发送 FeedEventMessage</text>

  <path class="line" d="M584 266 H624"/>
  <text class="label" x="604" y="252" text-anchor="middle">2. 监听队列并做幂等</text>

  <path class="line" d="M890 266 H930"/>
  <text class="label" x="910" y="252" text-anchor="middle">3. 查询粉丝列表</text>

  <path class="line" d="M1190 266 H1230"/>
  <text class="label" x="1210" y="252" text-anchor="middle">4. Pipeline 批量写 ZSet</text>

  <path class="dash" d="M763 340 V396 H1382 V340"/>
  <text class="label" x="1072" y="390" text-anchor="middle">商品类动态还会同步创建系统通知，提醒“你关注的对象有新内容”</text>

  <text class="section" x="76" y="476">2. 读取路径：滚动分页避免数据偏移</text>

  <rect class="node" x="76" y="514" width="240" height="116"/>
  <text class="node-title" x="196" y="560" text-anchor="middle">客户端</text>
  <text class="node-text" x="196" y="588" text-anchor="middle">lastId + offset 请求 Feed</text>

  <rect class="node" x="368" y="514" width="280" height="116"/>
  <text class="node-title" x="508" y="560" text-anchor="middle">feedServiceImpl</text>
  <text class="node-text" x="508" y="588" text-anchor="middle">queryFeedList(feedType, max, offset)</text>

  <rect class="store" x="700" y="514" width="272" height="116"/>
  <text class="node-title" x="836" y="560" text-anchor="middle">Redis ZSet 读信箱</text>
  <text class="node-text" x="836" y="588" text-anchor="middle">reverseRangeByScoreWithScores</text>

  <rect class="node" x="1024" y="514" width="258" height="116"/>
  <text class="node-title" x="1153" y="560" text-anchor="middle">资源策略装配</text>
  <text class="node-text" x="1153" y="588" text-anchor="middle">批量查店铺 / 商品 / 笔记详情</text>

  <rect class="node" x="1334" y="514" width="188" height="116"/>
  <text class="node-title" x="1428" y="560" text-anchor="middle">ScrollResult</text>
  <text class="node-text" x="1428" y="588" text-anchor="middle">list + minTime + offset</text>

  <path class="line" d="M316 556 H356"/>
  <text class="label" x="336" y="542" text-anchor="middle">5. 请求滚动读取</text>

  <path class="line" d="M648 556 H688"/>
  <text class="label" x="668" y="542" text-anchor="middle">6. 按时间分数读取</text>

  <path class="line" d="M972 556 H1012"/>
  <text class="label" x="992" y="542" text-anchor="middle">7. 聚合动作并批量装配资源</text>

  <path class="line" d="M1282 556 H1322"/>
  <text class="label" x="1302" y="542" text-anchor="middle">8. 返回给前端</text>

  <rect class="note" x="76" y="710" width="454" height="170"/>
  <text class="note-title" x="104" y="750">为什么这条链路很有代表性</text>
  <text class="note-text" x="104" y="786">- 它把“推拉结合”和“滚动分页”这两个 README 里的亮点真正落到实现上了。</text>
  <text class="note-text" x="104" y="814">- 写入靠 MQ + Pipeline，读取靠 ZSet score 游标，不是传统 page / size 分页。</text>
  <text class="note-text" x="104" y="842">- 这是社交流项目最容易体现工程取舍的一条链路。</text>

  <rect class="note" x="572" y="710" width="454" height="170"/>
  <text class="note-title" x="600" y="750">读者能一眼看懂的关键点</text>
  <text class="note-text" x="600" y="786">- FollowListener 先做 MQ 幂等，再调用 pushToFollowers。</text>
  <text class="note-text" x="600" y="814">- pushToFollowers 会同时写用户专属 feed 和 all feed 聚合层。</text>
  <text class="note-text" x="600" y="842">- queryFeedList 最终返回 ScrollResult，而不是普通分页对象。</text>

  <rect class="note" x="1068" y="710" width="454" height="170"/>
  <text class="note-title" x="1096" y="750">适合怎么放进开源文档</text>
  <text class="note-text" x="1096" y="786">- README 放入口链接即可，SHOWCASE 里把它和动态流截图放在一起看效果最好。</text>
  <text class="note-text" x="1096" y="814">- 面试或代码讲解时，这张图也能很自然地说明“为什么不用传统分页”。</text>
  <text class="note-text" x="1096" y="842">- 这是 SmartLive 社交部分最值得展示的实现之一。</text>
</svg>
