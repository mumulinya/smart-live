<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">关注 Feed 推送与滚动读取链路</title>
  <desc id="desc">展示 FeedEventMessage 写入粉丝信箱、Redis ZSet 批量推送，以及 ScrollResult 读链路的过程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfcff"/>
      <stop offset="100%" stop-color="#f3f8ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2d5d9f"/>
    </marker>
    <style>
      .title { font: 700 34px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #17365e; }
      .subtitle { font: 500 17px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #4b6988; }
      .section { font: 700 22px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #1d4b81; }
      .node-title { font: 700 22px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #143250; }
      .node-text { font: 500 16px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #35516e; }
      .step { font: 600 15px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #24486f; }
      .note-title { font: 700 19px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #23425f; }
      .note-text { font: 500 15px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #506983; }
      .node { fill: #ffffff; stroke: #a2bcdd; stroke-width: 2; rx: 24; }
      .mq { fill: #fff6eb; stroke: #efb882; stroke-width: 2; rx: 24; }
      .store { fill: #f2fbf5; stroke: #a6d5b6; stroke-width: 2; rx: 24; }
      .note { fill: #ffffff; stroke: #d7e3f4; stroke-width: 1.5; rx: 20; }
      .line { stroke: #2d5d9f; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6d90bf; stroke-width: 3; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1080" fill="url(#bg)"/>
  <rect x="34" y="34" width="1732" height="1012" rx="30" fill="#ffffff" stroke="#d9e6f5" stroke-width="2"/>

  <text class="title" x="74" y="96">关注 Feed 推送与滚动读取链路</text>
  <text class="subtitle" x="74" y="132">对应代码：FollowListener.handleSendNormalToFollowers + FollowServiceImpl.pushToFollowers + feedServiceImpl.queryFeedList</text>

  <text class="section" x="74" y="188">1. 写入路径：发布事件推到粉丝信箱</text>

  <rect class="node" x="70" y="220" width="250" height="140"/>
  <text class="node-title" x="195" y="270" text-anchor="middle">商品 / 店铺发布</text>
  <text class="node-text" x="195" y="304" text-anchor="middle">构建 FeedEventMessage</text>

  <rect class="mq" x="400" y="220" width="250" height="140"/>
  <text class="node-title" x="525" y="270" text-anchor="middle">Feed MQ</text>
  <text class="node-text" x="525" y="304" text-anchor="middle">INTERACT_FEED_EXCHANGE</text>

  <rect class="node" x="730" y="220" width="290" height="140"/>
  <text class="node-title" x="875" y="270" text-anchor="middle">FollowListener</text>
  <text class="node-text" x="875" y="304" text-anchor="middle">messageId 幂等消费</text>
  <text class="node-text" x="875" y="328" text-anchor="middle">失败时重试</text>

  <rect class="store" x="1100" y="220" width="260" height="140"/>
  <text class="node-title" x="1230" y="270" text-anchor="middle">粉丝集合</text>
  <text class="node-text" x="1230" y="304" text-anchor="middle">Redis ZSet</text>
  <text class="node-text" x="1230" y="328" text-anchor="middle">必要时 DB 兜底</text>

  <rect class="store" x="1440" y="220" width="290" height="140"/>
  <text class="node-title" x="1585" y="270" text-anchor="middle">用户 Feed ZSet</text>
  <text class="node-text" x="1585" y="304" text-anchor="middle">个人 feed + all feed</text>
  <text class="node-text" x="1585" y="328" text-anchor="middle">批量写入</text>

  <path class="line" d="M320 290 H388"/>
  <text class="step" x="354" y="194" text-anchor="middle">1. 发送</text>
  <text class="step" x="354" y="214" text-anchor="middle">FeedEventMessage</text>

  <path class="line" d="M650 290 H718"/>
  <text class="step" x="684" y="194" text-anchor="middle">2. 监听队列</text>
  <text class="step" x="684" y="214" text-anchor="middle">并做幂等</text>

  <path class="line" d="M1020 290 H1088"/>
  <text class="step" x="1054" y="194" text-anchor="middle">3. 查询</text>
  <text class="step" x="1054" y="214" text-anchor="middle">粉丝列表</text>

  <path class="line" d="M1360 290 H1428"/>
  <text class="step" x="1394" y="194" text-anchor="middle">4. Pipeline</text>
  <text class="step" x="1394" y="214" text-anchor="middle">批量写 ZSet</text>

  <path class="dash" d="M875 360 V430 H1585 V372"/>
  <text class="step" x="1230" y="414" text-anchor="middle">商品类动态还会同步创建系统通知，提醒“你关注的对象有新内容”</text>

  <text class="section" x="74" y="500">2. 读取路径：滚动分页避免数据偏移</text>

  <rect class="node" x="100" y="532" width="260" height="140"/>
  <text class="node-title" x="230" y="582" text-anchor="middle">客户端</text>
  <text class="node-text" x="230" y="616" text-anchor="middle">lastId + offset</text>
  <text class="node-text" x="230" y="640" text-anchor="middle">请求 Feed</text>

  <rect class="node" x="450" y="532" width="320" height="140"/>
  <text class="node-title" x="610" y="582" text-anchor="middle">feedServiceImpl</text>
  <text class="node-text" x="610" y="616" text-anchor="middle">queryFeedList</text>
  <text class="node-text" x="610" y="640" text-anchor="middle">(feedType, max, offset)</text>

  <rect class="store" x="860" y="532" width="290" height="140"/>
  <text class="node-title" x="1005" y="582" text-anchor="middle">Redis ZSet 读信箱</text>
  <text class="node-text" x="1005" y="616" text-anchor="middle">reverseRangeByScoreWithScores</text>

  <rect class="node" x="1240" y="532" width="270" height="140"/>
  <text class="node-title" x="1375" y="582" text-anchor="middle">资源策略装配</text>
  <text class="node-text" x="1375" y="616" text-anchor="middle">批量查店铺 / 商品 / 笔记</text>

  <rect class="node" x="1600" y="532" width="130" height="140"/>
  <text class="node-title" x="1665" y="582" text-anchor="middle">ScrollResult</text>
  <text class="node-text" x="1665" y="616" text-anchor="middle">list</text>
  <text class="node-text" x="1665" y="640" text-anchor="middle">minTime / offset</text>

  <path class="line" d="M360 602 H438"/>
  <text class="step" x="399" y="518" text-anchor="middle">5. 请求</text>
  <text class="step" x="399" y="538" text-anchor="middle">滚动读取</text>

  <path class="line" d="M770 602 H848"/>
  <text class="step" x="809" y="518" text-anchor="middle">6. 按时间分数</text>
  <text class="step" x="809" y="538" text-anchor="middle">读取信箱</text>

  <path class="line" d="M1150 602 H1228"/>
  <text class="step" x="1189" y="518" text-anchor="middle">7. 聚合动作并</text>
  <text class="step" x="1189" y="538" text-anchor="middle">批量装配资源</text>

  <path class="line" d="M1510 602 H1588"/>
  <text class="step" x="1549" y="518" text-anchor="middle">8. 返回给</text>
  <text class="step" x="1549" y="538" text-anchor="middle">前端</text>

  <rect class="note" x="70" y="760" width="500" height="220"/>
  <text class="note-title" x="102" y="806">为什么这条链路很有代表性</text>
  <text class="note-text" x="102" y="846">- 它把“推拉结合”和“滚动分页”两个 README 亮点真正落到了实现上。</text>
  <text class="note-text" x="102" y="876">- 写入靠 MQ + Pipeline，读取靠 ZSet score 游标，不是传统 page / size 分页。</text>
  <text class="note-text" x="102" y="906">- 这是社交流项目最容易体现工程取舍的一条链路。</text>

  <rect class="note" x="650" y="760" width="500" height="220"/>
  <text class="note-title" x="682" y="806">读者能一眼看懂的关键点</text>
  <text class="note-text" x="682" y="846">- FollowListener 先做 MQ 幂等，再调用 pushToFollowers。</text>
  <text class="note-text" x="682" y="876">- pushToFollowers 会同时写用户专属 feed 和 all feed 聚合层。</text>
  <text class="note-text" x="682" y="906">- queryFeedList 最终返回 ScrollResult，而不是普通分页对象。</text>

  <rect class="note" x="1230" y="760" width="500" height="220"/>
  <text class="note-title" x="1262" y="806">适合怎么放进开源文档</text>
  <text class="note-text" x="1262" y="846">- README 放入口链接即可，SHOWCASE 里和动态流截图放在一起看效果最好。</text>
  <text class="note-text" x="1262" y="876">- 面试或代码讲解时，这张图也能自然解释为什么不用传统分页。</text>
  <text class="note-text" x="1262" y="906">- 这是 SmartLive 社交部分最值得展示的实现之一。</text>
</svg>
