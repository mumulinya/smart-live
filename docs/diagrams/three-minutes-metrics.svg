<svg width="1440" height="520" viewBox="0 0 1440 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FBFF"/>
      <stop offset="1" stop-color="#EEF6FF"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1440" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCEEFF"/>
      <stop offset="1" stop-color="#F8FBFF"/>
    </linearGradient>
    <filter id="shadow" x="-20" y="-20" width="1480" height="560" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#A8C8EF" flood-opacity="0.22"/>
    </filter>
    <filter id="cardShadow" x="-10" y="-10" width="360" height="280" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#B7CAE6" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1440" height="520" rx="28" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="24" y="24" width="1392" height="472" rx="24" fill="#FFFFFF"/>
  </g>

  <rect x="56" y="52" width="1328" height="92" rx="18" fill="url(#head)" stroke="#D9EAFE"/>
  <rect x="82" y="76" width="8" height="44" rx="4" fill="#49A9F8"/>
  <text x="106" y="92" font-size="34" font-weight="700" fill="#1E293B" font-family="Segoe UI, Microsoft YaHei, Arial">3 分钟评审：先记住这 4 个数字</text>
  <text x="106" y="122" font-size="18" fill="#607089" font-family="Segoe UI, Microsoft YaHei, Arial">这是第一次评审 SmartLive 时最值得优先建立印象的规模与工程密度指标。</text>

  <g filter="url(#cardShadow)">
    <rect x="84" y="188" width="280" height="232" rx="24" fill="#FFFFFF" stroke="#D9EAFE"/>
    <rect x="84" y="188" width="280" height="68" rx="24" fill="#EEF8FF"/>
    <text x="112" y="230" font-size="26" font-weight="700" fill="#1F3B63" font-family="Segoe UI, Microsoft YaHei, Arial">业务模块</text>
    <text x="112" y="320" font-size="72" font-weight="800" fill="#0F172A" font-family="Segoe UI, Microsoft YaHei, Arial">16</text>
    <text x="214" y="320" font-size="28" font-weight="700" fill="#0F766E" font-family="Segoe UI, Microsoft YaHei, Arial">个</text>
    <text x="112" y="362" font-size="18" fill="#475569" font-family="Segoe UI, Microsoft YaHei, Arial">覆盖交易、内容、社交、AI、治理与资产等完整业务域。</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="404" y="188" width="280" height="232" rx="24" fill="#FFFFFF" stroke="#D9EAFE"/>
    <rect x="404" y="188" width="280" height="68" rx="24" fill="#EEF9F2"/>
    <text x="432" y="230" font-size="26" font-weight="700" fill="#1F3B63" font-family="Segoe UI, Microsoft YaHei, Arial">服务应用</text>
    <text x="432" y="320" font-size="72" font-weight="800" fill="#0F172A" font-family="Segoe UI, Microsoft YaHei, Arial">19</text>
    <text x="534" y="320" font-size="28" font-weight="700" fill="#16A34A" font-family="Segoe UI, Microsoft YaHei, Arial">个</text>
    <text x="432" y="362" font-size="18" fill="#475569" font-family="Segoe UI, Microsoft YaHei, Arial">不是单体演示，而是用户、商家、平台三侧协同的微服务系统。</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="724" y="188" width="280" height="232" rx="24" fill="#FFFFFF" stroke="#D9EAFE"/>
    <rect x="724" y="188" width="280" height="68" rx="24" fill="#FFF7EC"/>
    <text x="752" y="230" font-size="26" font-weight="700" fill="#1F3B63" font-family="Segoe UI, Microsoft YaHei, Arial">核心表</text>
    <text x="752" y="320" font-size="72" font-weight="800" fill="#0F172A" font-family="Segoe UI, Microsoft YaHei, Arial">53</text>
    <text x="854" y="320" font-size="28" font-weight="700" fill="#D97706" font-family="Segoe UI, Microsoft YaHei, Arial">张</text>
    <text x="752" y="362" font-size="18" fill="#475569" font-family="Segoe UI, Microsoft YaHei, Arial">交易、内容、社交、审核、AI 与调度等数据模型都已成体系。</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="1044" y="188" width="280" height="232" rx="24" fill="#FFFFFF" stroke="#D9EAFE"/>
    <rect x="1044" y="188" width="280" height="68" rx="24" fill="#FFF1F3"/>
    <text x="1072" y="230" font-size="26" font-weight="700" fill="#1F3B63" font-family="Segoe UI, Microsoft YaHei, Arial">秒杀 QPS</text>
    <text x="1072" y="320" font-size="72" font-weight="800" fill="#0F172A" font-family="Segoe UI, Microsoft YaHei, Arial">3200+</text>
    <text x="1072" y="362" font-size="18" fill="#475569" font-family="Segoe UI, Microsoft YaHei, Arial">说明高并发交易链路不只是讲设计，也有压测结果与工程实现支撑。</text>
  </g>
</svg>
