<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="920" viewBox="0 0 1800 920" role="img" aria-labelledby="title desc">
  <title id="title">SmartLive 开源文档阅读路径</title>
  <desc id="desc">展示第一次阅读 SmartLive 开源文档时，建议按 README、OPEN_SOURCE、DEPLOYMENT_GUIDE、CONTRIBUTING 的顺序推进。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfcff"/>
      <stop offset="100%" stop-color="#f3f8ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2d5d9f"/>
    </marker>
    <style>
      .title { font: 700 34px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #17365e; }
      .subtitle { font: 500 17px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #4b6988; }
      .node-title { font: 700 22px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #143250; }
      .node-text { font: 500 16px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #35516e; }
      .step { font: 700 15px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #24486f; }
      .note-title { font: 700 19px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #23425f; }
      .note-text { font: 500 15px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #506983; }
      .blue { fill: #ffffff; stroke: #a2bcdd; stroke-width: 2; rx: 24; }
      .orange { fill: #fff6eb; stroke: #efb882; stroke-width: 2; rx: 24; }
      .green { fill: #f2fbf5; stroke: #a6d5b6; stroke-width: 2; rx: 24; }
      .purple { fill: #f8f4ff; stroke: #c4a4e8; stroke-width: 2; rx: 24; }
      .note { fill: #ffffff; stroke: #d7e3f4; stroke-width: 1.5; rx: 20; }
      .line { stroke: #2d5d9f; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="920" fill="url(#bg)"/>
  <rect x="34" y="34" width="1732" height="852" rx="30" fill="#ffffff" stroke="#d9e6f5" stroke-width="2"/>

  <text class="title" x="74" y="96">SmartLive 开源文档阅读路径</text>
  <text class="subtitle" x="74" y="132">先理解项目，再跑最小链路，最后看部署和贡献规范。第一次接入按这个顺序会更稳，也更不容易迷路。</text>

  <rect class="blue" x="80" y="210" width="360" height="220"/>
  <text class="step" x="112" y="250">01 READ FIRST</text>
  <text class="node-title" x="112" y="292">README.md</text>
  <text class="node-text" x="112" y="332">项目定位</text>
  <text class="node-text" x="112" y="360">系统架构</text>
  <text class="node-text" x="112" y="388">核心业务链路</text>
  <text class="node-text" x="112" y="416">页面与视觉导览入口</text>

  <rect class="orange" x="500" y="210" width="360" height="220"/>
  <text class="step" x="532" y="250">02 RUN FIRST</text>
  <text class="node-title" x="532" y="292">OPEN_SOURCE.md</text>
  <text class="node-text" x="532" y="332">依赖矩阵</text>
  <text class="node-text" x="532" y="360">端口和模块启动顺序</text>
  <text class="node-text" x="532" y="388">最小可运行链路</text>
  <text class="node-text" x="532" y="416">已知注意事项</text>

  <rect class="green" x="920" y="210" width="360" height="220"/>
  <text class="step" x="952" y="250">03 DEPLOY NEXT</text>
  <text class="node-title" x="952" y="292">DEPLOYMENT_GUIDE.md</text>
  <text class="node-text" x="952" y="332">Docker Compose</text>
  <text class="node-text" x="952" y="360">镜像重建</text>
  <text class="node-text" x="952" y="388">JAR 校验</text>
  <text class="node-text" x="952" y="416">部署排错</text>

  <rect class="purple" x="1340" y="210" width="360" height="220"/>
  <text class="step" x="1372" y="250">04 CONTRIBUTE</text>
  <text class="node-title" x="1372" y="292">CONTRIBUTING.md</text>
  <text class="node-text" x="1372" y="332">分支规范</text>
  <text class="node-text" x="1372" y="360">提交格式</text>
  <text class="node-text" x="1372" y="388">自查清单</text>
  <text class="node-text" x="1372" y="416">安全边界</text>

  <path class="line" d="M440 320 H488"/>
  <path class="line" d="M860 320 H908"/>
  <path class="line" d="M1280 320 H1328"/>

  <rect class="note" x="120" y="530" width="1560" height="120"/>
  <text class="note-title" x="152" y="574">第一次接入最稳的路径</text>
  <text class="note-text" x="152" y="608">先启动 auth、gateway、system、user、shop、search，先确认登录、店铺、搜索和后台管理可用。</text>

  <rect class="note" x="120" y="700" width="500" height="120"/>
  <text class="note-title" x="152" y="744">这张图适合怎么讲</text>
  <text class="note-text" x="152" y="778">- README 用来看全貌，OPEN_SOURCE 用来第一次跑项目，部署和贡献文档放在后面按需进入。</text>
  <text class="note-text" x="152" y="806">- 这样新读者不会一上来就掉进部署细节里。</text>

  <rect class="note" x="650" y="700" width="500" height="120"/>
  <text class="note-title" x="682" y="744">和链路图的关系</text>
  <text class="note-text" x="682" y="778">- 先看 README 里的业务链路和页面导览，再决定要跑哪一条链、看哪一组详细图。</text>
  <text class="note-text" x="682" y="806">- 文档阅读路径本身就是接入成本管理的一部分。</text>

  <rect class="note" x="1180" y="700" width="500" height="120"/>
  <text class="note-title" x="1212" y="744">统一风格说明</text>
  <text class="note-text" x="1212" y="778">- 这张图现在和展示版链路图使用同一套标题区、卡片边框、底部说明卡片风格。</text>
  <text class="note-text" x="1212" y="806">- 打开 README、SHOWCASE 和 OPEN_SOURCE 时观感会更统一。</text>
</svg>
