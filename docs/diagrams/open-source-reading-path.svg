<svg width="1360" height="700" viewBox="0 0 1360 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1360" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FAFF"/>
      <stop offset="1" stop-color="#FFF7ED"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#F8FBFF"/>
    </linearGradient>
    <linearGradient id="cardOrange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFEDD5"/>
      <stop offset="1" stop-color="#FFF7ED"/>
    </linearGradient>
    <linearGradient id="cardGreen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#DCFCE7"/>
      <stop offset="1" stop-color="#F7FEE7"/>
    </linearGradient>
    <linearGradient id="cardPurple" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F3E8FF"/>
      <stop offset="1" stop-color="#FAF5FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 36px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 400 18px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #475569; }
      .card-title { font: 700 23px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #0F172A; }
      .card-label { font: 700 16px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #1D4ED8; }
      .card-body { font: 400 15px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #334155; }
      .foot { font: 600 17px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #7C2D12; }
    </style>
  </defs>

  <rect width="1360" height="700" rx="32" fill="url(#bg)"/>
  <rect x="36" y="32" width="1288" height="636" rx="28" fill="#FFFFFF" fill-opacity="0.78" stroke="#E2E8F0"/>

  <text x="680" y="90" text-anchor="middle" class="title">SmartLive 开源文档阅读路径</text>
  <text x="680" y="124" text-anchor="middle" class="subtitle">先理解项目，再运行最小链路，最后再做完整体验和部署，第一次接入会更稳。</text>

  <path d="M340 300H380" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <path d="M640 300H680" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <path d="M940 300H980" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <path d="M380 300L364 288M380 300L364 312" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <path d="M680 300L664 288M680 300L664 312" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <path d="M980 300L964 288M980 300L964 312" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="80" y="180" width="260" height="236" rx="24" fill="url(#cardBlue)" stroke="#7DD3FC"/>
    <rect x="380" y="180" width="260" height="236" rx="24" fill="url(#cardOrange)" stroke="#FDBA74"/>
    <rect x="680" y="180" width="260" height="236" rx="24" fill="url(#cardGreen)" stroke="#86EFAC"/>
    <rect x="980" y="180" width="260" height="236" rx="24" fill="url(#cardPurple)" stroke="#D8B4FE"/>
  </g>

  <text x="108" y="222" class="card-label">01 READ FIRST</text>
  <text x="108" y="260" class="card-title">README.md</text>
  <text x="108" y="306" class="card-body">项目定位</text>
  <text x="108" y="336" class="card-body">系统架构</text>
  <text x="108" y="366" class="card-body">业务截图</text>
  <text x="108" y="396" class="card-body">核心链路</text>

  <text x="408" y="222" class="card-label" fill="#C2410C">02 RUN FIRST</text>
  <text x="408" y="260" class="card-title">OPEN_SOURCE.md</text>
  <text x="408" y="306" class="card-body">依赖矩阵</text>
  <text x="408" y="336" class="card-body">端口表</text>
  <text x="408" y="366" class="card-body">启动顺序</text>
  <text x="408" y="396" class="card-body">已知注意事项</text>

  <text x="708" y="222" class="card-label" fill="#15803D">03 DEPLOY NEXT</text>
  <text x="708" y="256" class="card-title">
    <tspan x="708" dy="0">DEPLOYMENT</tspan>
    <tspan x="708" dy="28">GUIDE.md</tspan>
  </text>
  <text x="708" y="320" class="card-body">Docker Compose</text>
  <text x="708" y="350" class="card-body">镜像重建</text>
  <text x="708" y="380" class="card-body">JAR 校验</text>
  <text x="708" y="410" class="card-body">部署排错</text>

  <text x="1008" y="222" class="card-label" fill="#7C3AED">04 CONTRIBUTE</text>
  <text x="1008" y="260" class="card-title">CONTRIBUTING.md</text>
  <text x="1008" y="306" class="card-body">分支规范</text>
  <text x="1008" y="336" class="card-body">提交格式</text>
  <text x="1008" y="366" class="card-body">自查清单</text>
  <text x="1008" y="396" class="card-body">安全边界</text>

  <g filter="url(#shadow)">
    <rect x="120" y="472" width="1120" height="116" rx="24" fill="#FFF7ED" stroke="#FED7AA"/>
  </g>
  <text x="680" y="518" text-anchor="middle" class="foot">第一次接入最稳的路径</text>
  <text x="680" y="554" text-anchor="middle" class="subtitle">先启动 auth、gateway、system、user、shop、search，先确认登录、店铺、搜索和后台管理可用。</text>
</svg>
