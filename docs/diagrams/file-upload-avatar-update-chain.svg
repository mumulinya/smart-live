<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">头像上传与文件替换链路</title>
  <desc id="desc">展示用户头像上传经过 system 模块、file 模块、MinIO 存储并刷新登录缓存的流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfcff"/>
      <stop offset="100%" stop-color="#f2f8ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2d5d9f"/>
    </marker>
    <style>
      .title { font: 700 34px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #17365e; }
      .subtitle { font: 500 17px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #4b6988; }
      .section { font: 700 22px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #1d4b81; }
      .node-title { font: 700 22px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #143250; }
      .node-text { font: 500 16px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #35516e; }
      .label { font: 600 15px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #24486f; }
      .note-title { font: 700 18px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #23425f; }
      .note-text { font: 500 15px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #506983; }
      .node { fill: #ffffff; stroke: #a2bcdd; stroke-width: 2; rx: 24; }
      .store { fill: #f2fbf5; stroke: #a6d5b6; stroke-width: 2; rx: 24; }
      .cache { fill: #fff5eb; stroke: #efb882; stroke-width: 2; rx: 24; }
      .note { fill: #ffffff; stroke: #d7e3f4; stroke-width: 1.5; rx: 20; }
      .line { stroke: #2d5d9f; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6d90bf; stroke-width: 3; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="36" y="36" width="1528" height="828" rx="28" fill="#ffffff" stroke="#d9e6f5" stroke-width="2"/>

  <text class="title" x="76" y="96">头像上传与文件替换链路</text>
  <text class="subtitle" x="76" y="132">对应代码：SysProfileController.avatar + MinioSysFileServiceImpl.uploadFile / deleteFile</text>

  <text class="section" x="76" y="190">上传与替换主链路</text>

  <rect class="node" x="76" y="230" width="218" height="116"/>
  <text class="node-title" x="185" y="278" text-anchor="middle">用户 / 后台</text>
  <text class="node-text" x="185" y="306" text-anchor="middle">上传 avatarfile</text>

  <rect class="node" x="340" y="230" width="286" height="116"/>
  <text class="node-title" x="483" y="278" text-anchor="middle">smartLive-system</text>
  <text class="node-text" x="483" y="306" text-anchor="middle">SysProfileController 校验扩展名</text>

  <rect class="node" x="672" y="230" width="248" height="116"/>
  <text class="node-title" x="796" y="278" text-anchor="middle">smartLive-file</text>
  <text class="node-text" x="796" y="306" text-anchor="middle">remoteFileService.upload</text>

  <rect class="store" x="966" y="230" width="230" height="116"/>
  <text class="node-title" x="1081" y="278" text-anchor="middle">MinIO</text>
  <text class="node-text" x="1081" y="306" text-anchor="middle">putObject / removeObject</text>

  <rect class="cache" x="1242" y="230" width="280" height="116"/>
  <text class="node-title" x="1382" y="278" text-anchor="middle">用户信息与登录缓存</text>
  <text class="node-text" x="1382" y="306" text-anchor="middle">更新头像 + 刷新 tokenService</text>

  <path class="line" d="M294 272 H328"/>
  <text class="label" x="311" y="258" text-anchor="middle">1. /profile/avatar</text>

  <path class="line" d="M626 272 H660"/>
  <text class="label" x="643" y="258" text-anchor="middle">2. 远程调用文件服务</text>

  <path class="line" d="M920 272 H954"/>
  <text class="label" x="937" y="258" text-anchor="middle">3. 上传文件流</text>

  <path class="line" d="M1196 272 H1230"/>
  <text class="label" x="1213" y="258" text-anchor="middle">4. URL 回写用户头像</text>

  <path class="dash" d="M483 346 V398 H1081 V346"/>
  <text class="label" x="782" y="392" text-anchor="middle">5. 如果存在旧头像，则 remoteFileService.delete(oldAvatarUrl)</text>

  <path class="dash" d="M1382 346 V408"/>
  <text class="label" x="1382" y="432" text-anchor="middle">6. tokenService.setLoginUser 刷新缓存头像</text>

  <rect class="note" x="76" y="498" width="454" height="168"/>
  <text class="note-title" x="104" y="538">文件服务到底做了什么</text>
  <text class="note-text" x="104" y="574">- MinioSysFileServiceImpl 会生成文件名后调用 putObject。</text>
  <text class="note-text" x="104" y="602">- 返回值直接拼接为 minioUrl / bucket / fileName，可被前端立即访问。</text>
  <text class="note-text" x="104" y="630">- 删除旧头像时，会从 URL 中截出对象名，再调用 removeObject。</text>

  <rect class="note" x="572" y="498" width="454" height="168"/>
  <text class="note-title" x="600" y="538">这张图解决什么阅读问题</text>
  <text class="note-text" x="600" y="574">- 读者能立刻知道“上传不是直接落本地”，而是经过独立 file 微服务。</text>
  <text class="note-text" x="600" y="602">- 也能看清头像替换不是只改数据库，还会删旧文件并更新登录态缓存。</text>
  <text class="note-text" x="600" y="630">- 对排查头像不刷新、文件残留问题很有帮助。</text>

  <rect class="note" x="1068" y="498" width="454" height="168"/>
  <text class="note-title" x="1096" y="538">适合配合哪些截图一起看</text>
  <text class="note-text" x="1096" y="574">- 个人中心、登录页、后台用户头像修改。</text>
  <text class="note-text" x="1096" y="602">- 如果后续补部署文档，这张图也能顺带说明为什么必须把 MinIO 配好。</text>
  <text class="note-text" x="1096" y="630">- 这是很典型的“业务服务 + 文件服务 + 对象存储”协作样例。</text>
</svg>
