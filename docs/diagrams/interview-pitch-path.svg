<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">SmartLive 面试讲解路径</title>
  <desc id="desc">按系统架构、页面闭环、核心链路、技术判断四步讲解 SmartLive 项目的推荐顺序。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="cardGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#effcf6"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="cardOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="cardPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5372a8"/>
    </marker>
    <style>
      .panel { fill: url(#bg); stroke: #d5e3ff; stroke-width: 2; }
      .step { stroke-width: 2; rx: 28; ry: 28; }
      .title { font: 700 34px 'Segoe UI', 'PingFang SC', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px 'Segoe UI', 'PingFang SC', sans-serif; fill: #334155; }
      .label { font: 700 13px 'Segoe UI', 'PingFang SC', sans-serif; fill: #1d4ed8; letter-spacing: 0.08em; }
      .stepNo { font: 800 34px 'Segoe UI', 'PingFang SC', sans-serif; fill: #1e3a8a; }
      .stepTitle { font: 700 24px 'Segoe UI', 'PingFang SC', sans-serif; fill: #0f172a; }
      .stepText { font: 400 15px 'Segoe UI', 'PingFang SC', sans-serif; fill: #334155; }
      .small { font: 400 14px 'Segoe UI', 'PingFang SC', sans-serif; fill: #475569; }
      .arrow { stroke: #5372a8; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="16" y="16" width="1468" height="688" rx="30" ry="30" class="panel"/>

  <text x="750" y="72" text-anchor="middle" class="title">SmartLive 面试讲解路径</text>
  <text x="750" y="102" text-anchor="middle" class="subtitle">按“全局认知 -> 页面闭环 -> 强链路 -> 技术判断”的顺序讲，会比按模块平铺更有说服力</text>

  <text x="90" y="160" class="label">STEP 01</text>
  <rect x="66" y="178" width="640" height="150" class="step" fill="url(#cardBlue)" stroke="#93c5fd"/>
  <text x="120" y="244" class="stepNo">1</text>
  <text x="188" y="238" class="stepTitle">先讲系统架构与项目规模</text>
  <text x="188" y="272" class="stepText">用 1-2 分钟建立项目边界、服务数量、双端覆盖和基础设施分工。</text>
  <text x="188" y="302" class="small">推荐入口：系统架构图、服务依赖关系图、项目规模卡片</text>

  <text x="794" y="160" class="label">STEP 02</text>
  <rect x="770" y="178" width="664" height="150" class="step" fill="url(#cardGreen)" stroke="#34d399"/>
  <text x="824" y="244" class="stepNo">2</text>
  <text x="892" y="238" class="stepTitle">再讲页面导览和用户闭环</text>
  <text x="892" y="272" class="stepText">先给面试官看真实页面和用户路径，再把页面和业务能力对上。</text>
  <text x="892" y="302" class="small">推荐入口：页面效果图导览、业务链路视觉走查</text>

  <line x1="706" y1="253" x2="770" y2="253" class="arrow"/>

  <text x="90" y="404" class="label">STEP 03</text>
  <rect x="66" y="422" width="640" height="176" class="step" fill="url(#cardOrange)" stroke="#fb923c"/>
  <text x="120" y="488" class="stepNo">3</text>
  <text x="188" y="482" class="stepTitle">然后只挑 3 条最强链路展开</text>
  <text x="188" y="516" class="stepText">不要把所有链路都讲一遍，优先挑最能体现交易、高并发和设计能力的三条。</text>
  <text x="188" y="548" class="small">推荐顺序：秒杀抢购 -> 订单/支付/退款补偿 -> Redis 分层缓存</text>
  <text x="188" y="578" class="small">备用补充：RabbitMQ 消息可靠性、Feed 双轨同步、审核与搜索双写</text>

  <text x="794" y="404" class="label">STEP 04</text>
  <rect x="770" y="422" width="664" height="176" class="step" fill="url(#cardPurple)" stroke="#c084fc"/>
  <text x="824" y="488" class="stepNo">4</text>
  <text x="892" y="482" class="stepTitle">最后讲技术选型和难点踩坑</text>
  <text x="892" y="516" class="stepText">把“为什么这样做”和“做的时候踩过什么坑”讲出来，项目就会更像真实工程。</text>
  <text x="892" y="548" class="small">推荐入口：技术选型理由、难点踩坑与解决方案、常见问题 FAQ</text>
  <text x="892" y="578" class="small">重点讲取舍、边界和最终一致性，而不是只讲功能做完了什么</text>

  <line x1="706" y1="510" x2="770" y2="510" class="arrow"/>
  <line x1="386" y1="328" x2="386" y2="422" class="arrow"/>
  <line x1="1102" y1="328" x2="1102" y2="422" class="arrow"/>

  <rect x="66" y="628" width="1368" height="50" rx="18" ry="18" fill="#ffffff" stroke="#d5e3ff" stroke-width="2"/>
  <text x="750" y="660" text-anchor="middle" class="stepText">一句话版本：先建立全局认知，再证明页面真实存在，接着讲三条强链路，最后用选型与踩坑把项目讲“圆”。</text>
</svg>
