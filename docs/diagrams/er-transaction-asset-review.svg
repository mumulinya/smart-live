<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="360" viewBox="0 0 1480 360" role="img" aria-labelledby="title desc">
  <title id="title">用户、订单、钱包、积分与评价关系图</title>
  <desc id="desc">展示 user、order、user_wallet、payment_record、wallet_transaction、user_points_wallet、points_record 与 review 的主要关系。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#a9bddf" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#607fb8"/>
    </marker>
    <style>
      .bg { fill: #f7faff; stroke: #d9e5f6; stroke-width: 2; }
      .title { font: 700 28px 'Segoe UI', 'PingFang SC', sans-serif; fill: #193055; }
      .sub { font: 400 15px 'Segoe UI', 'PingFang SC', sans-serif; fill: #60708e; }
      .group { fill: #ffffff; stroke: #dfe7f4; stroke-width: 2; }
      .bar-blue { fill: #eaf2ff; stroke: #a8c3f5; }
      .bar-orange { fill: #fff3e8; stroke: #ffc18f; }
      .bar-green { fill: #eefcf3; stroke: #a7dfbc; }
      .bar-purple { fill: #f5f0ff; stroke: #c9b3ff; }
      .group-title { font: 700 18px 'Segoe UI', 'PingFang SC', sans-serif; fill: #213454; }
      .chip { rx: 12; ry: 12; stroke-width: 1.4; }
      .chip-blue { fill: #eff5ff; stroke: #bbcdf6; }
      .chip-orange { fill: #fff4eb; stroke: #ffd0aa; }
      .chip-green { fill: #f2fdf6; stroke: #b8e4c8; }
      .chip-purple { fill: #f7f3ff; stroke: #d5c3ff; }
      .chip-text { font: 600 17px 'Consolas', monospace; fill: #193055; }
      .line { fill: none; stroke: #607fb8; stroke-width: 3.4; marker-end: url(#arrow); }
      .line-dash { fill: none; stroke: #8ca5cf; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .legend { font: 400 14px 'Segoe UI', 'PingFang SC', sans-serif; fill: #6d7f9b; }
    </style>
  </defs>

  <rect x="12" y="12" width="1456" height="336" rx="28" ry="28" class="bg"/>
  <text x="48" y="54" class="title">用户 - 订单 - 钱包 - 积分 - 评价</text>
  <text x="48" y="82" class="sub">这组关系体现交易履约闭环：谁下单、钱怎么扣、流水记在哪里、积分如何回写、评价怎样挂回订单。</text>

  <g filter="url(#shadow)">
    <rect x="48" y="118" width="240" height="172" rx="24" ry="24" class="group"/>
    <rect x="68" y="136" width="104" height="30" rx="12" ry="12" class="bar-blue"/>
    <text x="84" y="157" class="group-title">用户主数据</text>
    <rect x="68" y="186" width="124" height="36" class="chip chip-blue"/><text x="86" y="210" class="chip-text">user</text>
    <rect x="68" y="236" width="156" height="36" class="chip chip-blue"/><text x="86" y="260" class="chip-text">user_info</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="344" y="118" width="240" height="172" rx="24" ry="24" class="group"/>
    <rect x="364" y="136" width="106" height="30" rx="12" ry="12" class="bar-orange"/>
    <text x="380" y="157" class="group-title">交易主轴</text>
    <rect x="364" y="186" width="126" height="36" class="chip chip-orange"/><text x="382" y="210" class="chip-text">order</text>
    <rect x="364" y="236" width="194" height="36" class="chip chip-orange"/><text x="382" y="260" class="chip-text">payment_record</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="118" width="300" height="172" rx="24" ry="24" class="group"/>
    <rect x="660" y="136" width="120" height="30" rx="12" ry="12" class="bar-green"/>
    <text x="676" y="157" class="group-title">钱包流水</text>
    <rect x="660" y="186" width="172" height="36" class="chip chip-green"/><text x="678" y="210" class="chip-text">user_wallet</text>
    <rect x="660" y="236" width="236" height="36" class="chip chip-green"/><text x="678" y="260" class="chip-text">wallet_transaction</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="996" y="118" width="300" height="172" rx="24" ry="24" class="group"/>
    <rect x="1016" y="136" width="120" height="30" rx="12" ry="12" class="bar-purple"/>
    <text x="1032" y="157" class="group-title">积分资产</text>
    <rect x="1016" y="186" width="228" height="36" class="chip chip-purple"/><text x="1034" y="210" class="chip-text">user_points_wallet</text>
    <rect x="1016" y="236" width="166" height="36" class="chip chip-purple"/><text x="1034" y="260" class="chip-text">points_record</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1334" y="118" width="106" height="172" rx="24" ry="24" class="group"/>
    <rect x="1352" y="136" width="68" height="30" rx="12" ry="12" class="bar-blue"/>
    <text x="1365" y="157" class="group-title">评价</text>
    <rect x="1352" y="206" width="70" height="36" class="chip chip-blue"/><text x="1365" y="230" class="chip-text">review</text>
  </g>

  <path d="M 288 204 C 314 204, 322 204, 344 204" class="line"/>
  <path d="M 288 252 C 420 314, 1220 314, 1352 230" class="line-dash"/>
  <path d="M 490 204 C 560 204, 588 204, 640 204" class="line"/>
  <path d="M 490 204 C 704 90, 1110 90, 1352 206" class="line-dash"/>
  <path d="M 490 252 C 566 252, 588 252, 640 252" class="line"/>
  <path d="M 832 204 C 914 204, 934 204, 1016 204" class="line-dash"/>
  <path d="M 832 252 C 914 252, 934 252, 1016 252" class="line-dash"/>

  <text x="52" y="326" class="legend">实线表示交易主状态流；虚线表示资产回写、积分变更与评价挂接等辅助关系。</text>
</svg>
