<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="360" viewBox="0 0 1480 360" role="img" aria-labelledby="title desc">
  <title id="title">店铺、商品、订单、评价与店铺分析关系图</title>
  <desc id="desc">展示 shop_type、shop、product、order、review 与 shop_analysis_record 的主要关系。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#a9bddf" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#607fb8"/>
    </marker>
    <style>
      .bg { fill: #f7faff; stroke: #d9e5f6; stroke-width: 2; }
      .title { font: 700 28px 'Segoe UI', 'PingFang SC', sans-serif; fill: #193055; }
      .sub { font: 400 15px 'Segoe UI', 'PingFang SC', sans-serif; fill: #60708e; }
      .group { fill: #ffffff; stroke: #dfe7f4; stroke-width: 2; }
      .bar-green { fill: #ebfbf1; stroke: #8fd9ab; }
      .bar-orange { fill: #fff3e8; stroke: #ffc591; }
      .bar-blue { fill: #ecf3ff; stroke: #afc7f6; }
      .bar-purple { fill: #f5f1ff; stroke: #ccb8ff; }
      .group-title { font: 700 18px 'Segoe UI', 'PingFang SC', sans-serif; fill: #213454; }
      .chip { rx: 12; ry: 12; stroke-width: 1.4; }
      .chip-green { fill: #effcf4; stroke: #a8e0be; }
      .chip-orange { fill: #fff4eb; stroke: #ffd2ab; }
      .chip-blue { fill: #eef5ff; stroke: #bed0f7; }
      .chip-purple { fill: #f7f3ff; stroke: #d4c4ff; }
      .chip-text { font: 600 17px 'Consolas', monospace; fill: #193055; }
      .line { fill: none; stroke: #607fb8; stroke-width: 3.4; marker-end: url(#arrow); }
      .line-dash { fill: none; stroke: #8ca5cf; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .legend { font: 400 14px 'Segoe UI', 'PingFang SC', sans-serif; fill: #6d7f9b; }
    </style>
  </defs>

  <rect x="12" y="12" width="1456" height="336" rx="28" ry="28" class="bg"/>
  <text x="48" y="54" class="title">店铺 - 商品 - 订单 - 评价 - 经营分析</text>
  <text x="48" y="82" class="sub">这组关系体现商家经营主线：店铺卖什么、商品如何成交、履约后如何沉淀评价，再如何回流到经营分析。</text>

  <g filter="url(#shadow)">
    <rect x="48" y="118" width="264" height="172" rx="24" ry="24" class="group"/>
    <rect x="68" y="136" width="144" height="30" rx="12" ry="12" class="bar-green"/>
    <text x="84" y="157" class="group-title">店铺基础域</text>
    <rect x="68" y="186" width="148" height="36" class="chip chip-green"/><text x="86" y="210" class="chip-text">shop_type</text>
    <rect x="68" y="236" width="108" height="36" class="chip chip-green"/><text x="86" y="260" class="chip-text">shop</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="372" y="118" width="180" height="172" rx="24" ry="24" class="group"/>
    <rect x="392" y="136" width="104" height="30" rx="12" ry="12" class="bar-orange"/>
    <text x="408" y="157" class="group-title">商品域</text>
    <rect x="392" y="206" width="130" height="36" class="chip chip-orange"/><text x="410" y="230" class="chip-text">product</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="612" y="118" width="180" height="172" rx="24" ry="24" class="group"/>
    <rect x="632" y="136" width="104" height="30" rx="12" ry="12" class="bar-blue"/>
    <text x="648" y="157" class="group-title">订单域</text>
    <rect x="632" y="206" width="116" height="36" class="chip chip-blue"/><text x="650" y="230" class="chip-text">order</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="852" y="118" width="180" height="172" rx="24" ry="24" class="group"/>
    <rect x="872" y="136" width="104" height="30" rx="12" ry="12" class="bar-purple"/>
    <text x="888" y="157" class="group-title">评价域</text>
    <rect x="872" y="206" width="128" height="36" class="chip chip-purple"/><text x="890" y="230" class="chip-text">review</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1092" y="118" width="320" height="172" rx="24" ry="24" class="group"/>
    <rect x="1112" y="136" width="176" height="30" rx="12" ry="12" class="bar-green"/>
    <text x="1128" y="157" class="group-title">经营分析快照</text>
    <rect x="1112" y="206" width="258" height="36" class="chip chip-green"/><text x="1130" y="230" class="chip-text">shop_analysis_record</text>
  </g>

  <path d="M 176 236 C 262 236, 298 236, 392 224" class="line"/>
  <path d="M 216 204 C 216 150, 706 150, 706 206" class="line-dash"/>
  <path d="M 522 224 C 566 224, 586 224, 632 224" class="line"/>
  <path d="M 748 224 C 796 224, 824 224, 872 224" class="line"/>
  <path d="M 176 236 C 304 316, 1082 316, 1240 242" class="line-dash"/>
  <path d="M 1000 224 C 1042 224, 1060 224, 1112 224" class="line-dash"/>
  <path d="M 522 224 C 886 112, 1104 112, 1240 206" class="line-dash"/>

  <text x="52" y="326" class="legend">订单和评价是商家经营分析的核心数据源；虚线表示回流到分析快照的治理链路。</text>
</svg>
