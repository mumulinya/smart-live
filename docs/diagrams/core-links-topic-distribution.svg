<svg width="1560" height="760" viewBox="0 0 1560 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1560" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#F4F8FF"/>
    </linearGradient>
    <filter id="shadow" x="-30" y="-30" width="1620" height="820" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1D4ED8" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { font: 700 30px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #1F2A44; }
      .subtitle { font: 500 16px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #61708A; }
      .cardTitle { font: 700 20px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #1F2A44; }
      .body { font: 500 14px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #55657E; }
      .count { font: 700 42px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #1F2A44; }
      .chip { font: 700 12px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #2E5BD1; }
    </style>
  </defs>

  <rect width="1560" height="760" rx="28" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="18" y="18" width="1524" height="724" rx="24" fill="#FFFFFF" fill-opacity="0.9"/>
  </g>

  <text x="780" y="72" text-anchor="middle" class="title">核心链路专题分布图</text>
  <text x="780" y="102" text-anchor="middle" class="subtitle">9 条专题不是平均铺开，而是围绕交易闭环、异步协作、治理搜索和 AI 融合这四条主线展开。</text>

  <g transform="translate(78 160)">
    <rect width="320" height="330" rx="24" fill="#EEF5FF" stroke="#C6DAFF" stroke-width="2"/>
    <rect x="20" y="20" width="116" height="28" rx="14" fill="#D9E8FF"/>
    <text x="78" y="39" text-anchor="middle" class="chip">交易主战场</text>
    <text x="24" y="92" class="count">4</text>
    <text x="24" y="124" class="cardTitle">交易、高并发与一致性</text>
    <text x="24" y="164" class="body">• 秒杀抢购</text>
    <text x="24" y="194" class="body">• Redis 分层缓存</text>
    <text x="24" y="224" class="body">• 订单、支付与退款补偿</text>
    <text x="24" y="254" class="body">• RabbitMQ 可靠性</text>
    <text x="24" y="298" class="body">高并发、缓存、消息与补偿</text>
    <text x="24" y="322" class="body">几乎都收敛在这一组里。</text>
  </g>

  <g transform="translate(430 160)">
    <rect width="320" height="330" rx="24" fill="#F0FBF6" stroke="#C9ECD9" stroke-width="2"/>
    <rect x="20" y="20" width="128" height="28" rx="14" fill="#DDF7EC"/>
    <text x="84" y="39" text-anchor="middle" class="chip">社交阅读链路</text>
    <text x="24" y="92" class="count">1</text>
    <text x="24" y="124" class="cardTitle">社交、Feed 与数据同步</text>
    <text x="24" y="170" class="body">• Feed 推送与滚动读取</text>
    <text x="24" y="200" class="body">• 互动双轨同步</text>
    <text x="24" y="254" class="body">更强调分页、分发和副本收敛，</text>
    <text x="24" y="278" class="body">是社交链路的代表专题。</text>
  </g>

  <g transform="translate(782 160)">
    <rect width="320" height="330" rx="24" fill="#FFF7EC" stroke="#FFD8AD" stroke-width="2"/>
    <rect x="20" y="20" width="134" height="28" rx="14" fill="#FFE8C8"/>
    <text x="87" y="39" text-anchor="middle" class="chip">治理与搜索主线</text>
    <text x="24" y="92" class="count">3</text>
    <text x="24" y="124" class="cardTitle">审核、搜索与热榜</text>
    <text x="24" y="164" class="body">• 审核责任链与发布回写</text>
    <text x="24" y="194" class="body">• 搜索读链路与热词沉淀</text>
    <text x="24" y="224" class="body">• 热榜洗牌与全量重建</text>
    <text x="24" y="268" class="body">覆盖治理、搜索、排行和副本同步。</text>
  </g>

  <g transform="translate(1134 160)">
    <rect width="348" height="330" rx="24" fill="#F6F0FF" stroke="#DCCEFF" stroke-width="2"/>
    <rect x="20" y="20" width="120" height="28" rx="14" fill="#E8DEFF"/>
    <text x="80" y="39" text-anchor="middle" class="chip">业务融合方向</text>
    <text x="24" y="92" class="count">1</text>
    <text x="24" y="124" class="cardTitle">AI 与业务融合</text>
    <text x="24" y="170" class="body">• AI Agent 策略路由</text>
    <text x="24" y="200" class="body">• RAG 多维增强生成</text>
    <text x="24" y="230" class="body">• 店铺、商品、评价、博客上下文联动</text>
    <text x="24" y="278" class="body">最能体现项目不是“单独接一个聊天框”。</text>
  </g>

  <g transform="translate(78 546)">
    <rect width="1404" height="62" rx="18" fill="#FFFFFF" stroke="#DDE8FF"/>
    <text x="28" y="36" class="body">推荐讲法：先用左一的 4 条交易链路立住“系统复杂度”，再补右侧 5 条异步、治理和 AI 链路，项目价值会更完整。</text>
  </g>
</svg>
