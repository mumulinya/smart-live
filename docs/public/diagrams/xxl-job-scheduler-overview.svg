<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc">
  <title id="title">XXL-JOB 定时任务体系总览</title>
  <desc id="desc">展示 SmartLive 中 28 个 XXL-JOB 任务如何分成订单、秒杀、互动同步、热榜增量、热榜重建和销量同步 6 大组，并分别落到 Redis、MySQL、MQ 和榜单维护场景。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfcff"/>
      <stop offset="100%" stop-color="#f3f8ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2d5d9f"/>
    </marker>
    <style>
      .title { font: 700 34px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #17365e; }
      .subtitle { font: 500 17px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #4b6988; }
      .section { font: 700 22px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #1d4b81; }
      .node-title { font: 700 22px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #143250; }
      .node-text { font: 500 16px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #35516e; }
      .step { font: 600 15px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #24486f; }
      .note-title { font: 700 19px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #23425f; }
      .note-text { font: 500 15px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #506983; }
      .node { fill: #ffffff; stroke: #a2bcdd; stroke-width: 2; rx: 24; }
      .store { fill: #f2fbf5; stroke: #a6d5b6; stroke-width: 2; rx: 24; }
      .mq { fill: #fff6eb; stroke: #efb882; stroke-width: 2; rx: 24; }
      .decision { fill: #f8f4ff; stroke: #c4a4e8; stroke-width: 2; rx: 24; }
      .note { fill: #ffffff; stroke: #d7e3f4; stroke-width: 1.5; rx: 20; }
      .line { stroke: #2d5d9f; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6d90bf; stroke-width: 3; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1160" fill="url(#bg)"/>
  <rect x="34" y="34" width="1732" height="1092" rx="30" fill="#ffffff" stroke="#d9e6f5" stroke-width="2"/>

  <text class="title" x="74" y="96">XXL-JOB 定时任务体系总览</text>
  <text class="subtitle" x="74" y="132">对应代码：OrderExpireJobHandler + ProductSeckillJobHandler + InteractionSyncXxlJob + HotRankJobHandler + FullRebuildJobHandler + ProductSalesSyncJob + ShopSalesSyncJob</text>

  <text class="section" x="74" y="188">1. 调度中心统一承接后台批处理和兜底任务，当前共 28 个任务</text>

  <rect class="node" x="520" y="220" width="760" height="150"/>
  <text class="node-title" x="900" y="276" text-anchor="middle">XXL-JOB Admin / 执行器</text>
  <text class="node-text" x="900" y="312" text-anchor="middle">统一扫描 @XxlJob 入口，按 CRON 调度不同任务</text>
  <text class="node-text" x="900" y="338" text-anchor="middle">大部分 Job 内部再交给 executorService 异步执行，避免阻塞调度线程</text>

  <text class="section" x="74" y="438">2. 28 个任务拆成 6 组，分别承接生命周期、同步和榜单维护</text>

  <rect class="node" x="70" y="470" width="500" height="180"/>
  <text class="node-title" x="320" y="528" text-anchor="middle">订单生命周期任务（2）</text>
  <text class="node-text" x="320" y="564" text-anchor="middle">orderSoonExpireJobHandler / orderExpireJobHandler</text>
  <text class="node-text" x="320" y="590" text-anchor="middle">临期提醒、已支付过期处理、退款补偿兜底</text>
  <text class="node-text" x="320" y="616" text-anchor="middle">把交易链路里不适合实时扫描的收口工作交给调度</text>

  <rect class="mq" x="650" y="470" width="500" height="180"/>
  <text class="node-title" x="900" y="528" text-anchor="middle">秒杀生命周期任务（4）</text>
  <text class="node-text" x="900" y="564" text-anchor="middle">PreHeat / SoonEnd / Recovery / StockCheck</text>
  <text class="node-text" x="900" y="590" text-anchor="middle">库存预热、临期提醒、到期回收、库存校准</text>
  <text class="node-text" x="900" y="616" text-anchor="middle">把营销触达、缓存治理和最终一致性拆成不同任务</text>

  <rect class="store" x="1230" y="470" width="500" height="180"/>
  <text class="node-title" x="1480" y="528" text-anchor="middle">互动同步任务（7）</text>
  <text class="node-text" x="1480" y="564" text-anchor="middle">All / Like / Comment / Star / Review / Follow / Fans</text>
  <text class="node-text" x="1480" y="590" text-anchor="middle">把 Redis 热互动数据批量回刷 MySQL</text>
  <text class="node-text" x="1480" y="616" text-anchor="middle">承接点赞、评论、收藏、评价、关注和粉丝的最终一致性</text>

  <rect class="decision" x="70" y="710" width="500" height="180"/>
  <text class="node-title" x="320" y="768" text-anchor="middle">热榜增量任务（5）</text>
  <text class="node-text" x="320" y="804" text-anchor="middle">blog / shop / product / review / comment</text>
  <text class="node-text" x="320" y="830" text-anchor="middle">按业务类型执行 calcHotRankDataByBizType</text>
  <text class="node-text" x="320" y="856" text-anchor="middle">消费 calcQueue 做增量洗牌和榜单刷新</text>

  <rect class="decision" x="650" y="710" width="500" height="180"/>
  <text class="node-title" x="900" y="768" text-anchor="middle">热榜全量重建任务（6）</text>
  <text class="node-text" x="900" y="804" text-anchor="middle">allFullRebuild + blog / shop / product / review / comment</text>
  <text class="node-text" x="900" y="830" text-anchor="middle">凌晨拉全量对象并重建完整榜单</text>
  <text class="node-text" x="900" y="856" text-anchor="middle">长期修正漂移、遗漏对象和脏数据</text>

  <rect class="store" x="1230" y="710" width="500" height="180"/>
  <text class="node-title" x="1480" y="768" text-anchor="middle">销量同步任务（2）</text>
  <text class="node-text" x="1480" y="804" text-anchor="middle">productSalesSyncJob / shopSalesSyncJob</text>
  <text class="node-text" x="1480" y="830" text-anchor="middle">把商品销量、店铺销量从 Redis 回写 MySQL</text>
  <text class="node-text" x="1480" y="856" text-anchor="middle">为经营分析、排行榜和详情页展示提供稳定基线</text>

  <path class="line" d="M900 370 V420 H320 V458"/>
  <text class="step" x="610" y="410" text-anchor="middle">1. 订单任务</text>
  <path class="line" d="M900 370 V458"/>
  <text class="step" x="900" y="410" text-anchor="middle">2. 秒杀任务</text>
  <path class="line" d="M900 370 V420 H1480 V458"/>
  <text class="step" x="1190" y="410" text-anchor="middle">3. 互动同步任务</text>
  <path class="dash" d="M320 650 V698"/>
  <text class="step" x="320" y="686" text-anchor="middle">4. 热榜增量</text>
  <path class="dash" d="M900 650 V698"/>
  <text class="step" x="900" y="686" text-anchor="middle">5. 热榜重建</text>
  <path class="dash" d="M1480 650 V698"/>
  <text class="step" x="1480" y="686" text-anchor="middle">6. 销量同步</text>

  <rect class="note" x="70" y="940" width="500" height="120"/>
  <text class="note-title" x="102" y="982">为什么这张图要独立存在</text>
  <text class="note-text" x="102" y="1012">- 它把“哪些事必须由调度来做”讲清楚，和用户请求链路分开看更容易理解。</text>
  <text class="note-text" x="102" y="1040">- 订单兜底、秒杀校准、热榜重建这些都不适合塞回接口实时处理。</text>

  <rect class="note" x="650" y="940" width="500" height="120"/>
  <text class="note-title" x="682" y="982">适合怎么讲</text>
  <text class="note-text" x="682" y="1012">- RabbitMQ 负责事件一发生就推进，XXL-JOB 负责定时扫描、补偿兜底和批量重建。</text>
  <text class="note-text" x="682" y="1040">- 两者一起，才同时拿到实时性和最终一致性。</text>

  <rect class="note" x="1230" y="940" width="500" height="120"/>
  <text class="note-title" x="1262" y="982">和详细版的关系</text>
  <text class="note-text" x="1262" y="1012">- 展示版只讲 6 大任务组和职责边界；想看分发入口、执行器和具体任务流，再点详细版。</text>
  <text class="note-text" x="1262" y="1040">- 这样首页图集不会一上来就把细节压得太重。</text>
</svg>
