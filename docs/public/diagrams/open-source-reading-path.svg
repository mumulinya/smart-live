<svg width="1560" height="860" viewBox="0 0 1560 860" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1560" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#F4F8FF"/>
    </linearGradient>
    <filter id="shadow" x="-30" y="-30" width="1620" height="920" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1D4ED8" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L10 6L1 11" stroke="#4A7CEB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #1F2A44; }
      .subtitle { font: 500 16px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #64748B; }
      .cardTitle { font: 700 20px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #1F2A44; }
      .body { font: 500 14px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #55657E; }
      .small { font: 500 13px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #6D7A8F; }
      .chip { font: 700 12px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #2C60D4; }
      .step { font: 700 16px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #FFFFFF; }
      .accent { font: 700 14px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #2C60D4; }
    </style>
  </defs>

  <rect width="1560" height="860" rx="28" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="18" y="18" width="1524" height="824" rx="24" fill="#FFFFFF" fill-opacity="0.9"/>
  </g>

  <text x="780" y="72" text-anchor="middle" class="title">SmartLive 开源文档阅读路径</text>
  <text x="780" y="102" text-anchor="middle" class="subtitle">先理解项目，再看开源接入，最后进入部署和贡献规范。第一次读文档按这个顺序会更稳，也更不容易迷路。</text>

  <g transform="translate(78 154)">
    <rect width="320" height="184" rx="24" fill="#EEF5FF" stroke="#C6DAFF" stroke-width="2"/>
    <circle cx="40" cy="40" r="22" fill="#2F6CF4"/>
    <text x="40" y="46" text-anchor="middle" class="step">1</text>
    <text x="80" y="46" class="cardTitle">网站首页 / README</text>
    <text x="24" y="92" class="body">• 先看项目定位和系统全貌</text>
    <text x="24" y="122" class="body">• 先建立“这项目是什么”的整体认知</text>
    <text x="24" y="152" class="body">• 再决定接下来是看页面、看链路还是准备启动</text>
  </g>

  <g transform="translate(430 154)">
    <rect width="320" height="184" rx="24" fill="#F0FBF6" stroke="#C9ECD9" stroke-width="2"/>
    <circle cx="40" cy="40" r="22" fill="#1BA672"/>
    <text x="40" y="46" text-anchor="middle" class="step">2</text>
    <text x="80" y="46" class="cardTitle">OPEN_SOURCE</text>
    <text x="24" y="92" class="body">• 看依赖矩阵、端口、Nacos 和 SQL</text>
    <text x="24" y="122" class="body">• 明确最小可运行链路该先配什么</text>
    <text x="24" y="152" class="body">• 解决“第一次怎么开始”的问题</text>
  </g>

  <g transform="translate(782 154)">
    <rect width="320" height="184" rx="24" fill="#FFF7EC" stroke="#FFD8AD" stroke-width="2"/>
    <circle cx="40" cy="40" r="22" fill="#F08B22"/>
    <text x="40" y="46" text-anchor="middle" class="step">3</text>
    <text x="80" y="46" class="cardTitle">DEPLOYMENT_GUIDE</text>
    <text x="24" y="92" class="body">• 看本地联调和 Docker 演示两条部署路径</text>
    <text x="24" y="122" class="body">• 决定你这次是做联调、演示还是部署准备</text>
    <text x="24" y="152" class="body">• 把部署问题和启动问题分开处理</text>
  </g>

  <g transform="translate(1134 154)">
    <rect width="348" height="184" rx="24" fill="#F6F0FF" stroke="#DCCEFF" stroke-width="2"/>
    <circle cx="40" cy="40" r="22" fill="#7D63F7"/>
    <text x="40" y="46" text-anchor="middle" class="step">4</text>
    <text x="80" y="46" class="cardTitle">CONTRIBUTING / SECURITY</text>
    <text x="24" y="92" class="body">• 最后再看分支、提交、自查与安全边界</text>
    <text x="24" y="122" class="body">• 适合准备提 PR、改配置、做二次扩展时进入</text>
    <text x="24" y="152" class="body">• 不是第一次接仓库时最先需要读的东西</text>
  </g>

  <path d="M398 246H420" stroke="#4A7CEB" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M750 246H772" stroke="#4A7CEB" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1102 246H1124" stroke="#4A7CEB" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(82 382)">
    <rect width="456" height="184" rx="24" fill="#FFFFFF" stroke="#D7E6FF" stroke-width="2"/>
    <rect x="24" y="24" width="110" height="30" rx="15" fill="#E9F1FF"/>
    <text x="79" y="44" text-anchor="middle" class="chip">第一次最稳路径</text>
    <text x="24" y="88" class="cardTitle">先理解，再启动，再部署</text>
    <text x="24" y="124" class="body">不要一上来就陷进 Docker、Nacos 或镜像问题里。</text>
    <text x="24" y="154" class="body">先把项目边界和最小链路看明白，后面排错会轻松很多。</text>
  </g>

  <g transform="translate(552 382)">
    <rect width="456" height="184" rx="24" fill="#FFFFFF" stroke="#D7E6FF" stroke-width="2"/>
    <rect x="24" y="24" width="108" height="30" rx="15" fill="#E9F1FF"/>
    <text x="78" y="44" text-anchor="middle" class="chip">和页面的关系</text>
    <text x="24" y="88" class="cardTitle">如果你更关心“项目长什么样”</text>
    <text x="24" y="124" class="body">可以先从页面总览和业务走查进入，再回到开源接入。</text>
    <text x="24" y="154" class="body">文档阅读路径本身就是接入成本管理的一部分。</text>
  </g>

  <g transform="translate(1022 382)">
    <rect width="456" height="184" rx="24" fill="#FFFFFF" stroke="#D7E6FF" stroke-width="2"/>
    <rect x="24" y="24" width="132" height="30" rx="15" fill="#E9F1FF"/>
    <text x="90" y="44" text-anchor="middle" class="chip">这张图怎么讲</text>
    <text x="24" y="88" class="cardTitle">它不是流程图，而是阅读优先级图</text>
    <text x="24" y="124" class="body">推荐讲法：主页看全貌，开源页看接入，部署页看环境，规范页看协作边界。</text>
    <text x="24" y="154" class="body">这样第一次接仓库的人不会一开始就迷路。</text>
  </g>

  <g transform="translate(82 626)">
    <rect width="1396" height="154" rx="24" fill="#FFFFFF" stroke="#D7E6FF" stroke-width="2"/>
    <text x="28" y="46" class="cardTitle">一句话总结</text>
    <g transform="translate(28 66)">
      <rect width="304" height="56" rx="16" fill="#F7FAFF" stroke="#E2EBFF"/>
      <text x="18" y="24" class="accent">先看全貌</text>
      <text x="18" y="44" class="small">主页 / README 用来快速建立项目认知</text>
    </g>
    <g transform="translate(360 66)">
      <rect width="304" height="56" rx="16" fill="#F7FAFF" stroke="#E2EBFF"/>
      <text x="18" y="24" class="accent">再看接入</text>
      <text x="18" y="44" class="small">OPEN_SOURCE 解决“第一次怎么跑起来”</text>
    </g>
    <g transform="translate(692 66)">
      <rect width="304" height="56" rx="16" fill="#F7FAFF" stroke="#E2EBFF"/>
      <text x="18" y="24" class="accent">按需看部署</text>
      <text x="18" y="44" class="small">DEPLOYMENT_GUIDE 更适合演示和服务器准备</text>
    </g>
    <g transform="translate(1024 66)">
      <rect width="344" height="56" rx="16" fill="#F7FAFF" stroke="#E2EBFF"/>
      <text x="18" y="24" class="accent">最后看规范</text>
      <text x="18" y="44" class="small">贡献和安全边界放在真正准备改仓库时再读</text>
    </g>
  </g>
</svg>
