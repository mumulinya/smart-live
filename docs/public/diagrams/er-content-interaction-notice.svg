<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="390" viewBox="0 0 1480 390" role="img" aria-labelledby="title desc">
  <title id="title">博客、评价、评论、互动与通知关系图</title>
  <desc id="desc">展示 blog、review、comment、like_record、star、follow、shop 与 chat_system_notice 的主要关系。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#a9bddf" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#607fb8"/>
    </marker>
    <style>
      .bg { fill: #f7faff; stroke: #d9e5f6; stroke-width: 2; }
      .title { font: 700 28px 'Segoe UI', 'PingFang SC', sans-serif; fill: #193055; }
      .sub { font: 400 15px 'Segoe UI', 'PingFang SC', sans-serif; fill: #60708e; }
      .group { fill: #ffffff; stroke: #dfe7f4; stroke-width: 2; }
      .bar-teal { fill: #eafcff; stroke: #8edeea; }
      .bar-blue { fill: #eef5ff; stroke: #b8cdf6; }
      .bar-yellow { fill: #fff8e8; stroke: #f3d18a; }
      .group-title { font: 700 18px 'Segoe UI', 'PingFang SC', sans-serif; fill: #213454; }
      .chip { rx: 12; ry: 12; stroke-width: 1.4; }
      .chip-teal { fill: #eefcff; stroke: #a7e4ee; }
      .chip-blue { fill: #eef5ff; stroke: #bfd1f8; }
      .chip-yellow { fill: #fffaf0; stroke: #f4d69e; }
      .chip-text { font: 600 17px 'Consolas', monospace; fill: #193055; }
      .line { fill: none; stroke: #607fb8; stroke-width: 3.4; marker-end: url(#arrow); }
      .line-dash { fill: none; stroke: #8ca5cf; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .legend { font: 400 14px 'Segoe UI', 'PingFang SC', sans-serif; fill: #6d7f9b; }
    </style>
  </defs>

  <rect x="12" y="12" width="1456" height="366" rx="28" ry="28" class="bg"/>
  <text x="48" y="54" class="title">博客 / 评价 - 评论 / 点赞 / 收藏 / 关注 - 通知</text>
  <text x="48" y="82" class="sub">这组关系体现内容与社交互动链路：内容发布后，评论、点赞、收藏、关注与通知如何复用同一套互动模型。</text>

  <g filter="url(#shadow)">
    <rect x="48" y="116" width="270" height="182" rx="24" ry="24" class="group"/>
    <rect x="68" y="134" width="130" height="30" rx="12" ry="12" class="bar-teal"/>
    <text x="84" y="155" class="group-title">内容来源</text>
    <rect x="68" y="188" width="108" height="36" class="chip chip-teal"/><text x="86" y="212" class="chip-text">blog</text>
    <rect x="68" y="238" width="128" height="36" class="chip chip-teal"/><text x="86" y="262" class="chip-text">review</text>
    <rect x="68" y="288" width="104" height="36" class="chip chip-teal"/><text x="86" y="312" class="chip-text">shop</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="404" y="116" width="350" height="224" rx="24" ry="24" class="group"/>
    <rect x="424" y="134" width="146" height="30" rx="12" ry="12" class="bar-blue"/>
    <text x="440" y="155" class="group-title">互动模型</text>
    <rect x="424" y="188" width="140" height="36" class="chip chip-blue"/><text x="442" y="212" class="chip-text">comment</text>
    <rect x="580" y="188" width="180" height="36" class="chip chip-blue"/><text x="598" y="212" class="chip-text">like_record</text>
    <rect x="424" y="238" width="106" height="36" class="chip chip-blue"/><text x="442" y="262" class="chip-text">star</text>
    <rect x="546" y="238" width="122" height="36" class="chip chip-blue"/><text x="564" y="262" class="chip-text">follow</text>
    <rect x="424" y="288" width="300" height="36" class="chip chip-blue"/><text x="442" y="312" class="chip-text">source_type + source_id</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="858" y="116" width="280" height="182" rx="24" ry="24" class="group"/>
    <rect x="878" y="134" width="110" height="30" rx="12" ry="12" class="bar-yellow"/>
    <text x="894" y="155" class="group-title">通知中心</text>
    <rect x="878" y="214" width="214" height="36" class="chip chip-yellow"/><text x="896" y="238" class="chip-text">chat_system_notice</text>
  </g>

  <path d="M 176 206 C 270 206, 302 206, 424 206" class="line"/>
  <path d="M 176 256 C 270 256, 302 256, 580 206" class="line-dash"/>
  <path d="M 176 206 C 316 326, 582 326, 724 306" class="line-dash"/>
  <path d="M 176 256 C 264 256, 302 256, 424 256" class="line"/>
  <path d="M 176 306 C 314 306, 330 256, 424 256" class="line-dash"/>
  <path d="M 724 206 C 784 206, 804 206, 878 224" class="line"/>
  <path d="M 724 306 C 814 320, 846 282, 878 248" class="line-dash"/>

  <text x="52" y="352" class="legend">评论、点赞、收藏、关注通过通用互动模型复用；通知中心负责把互动结果继续回推到消息侧。</text>
</svg>
