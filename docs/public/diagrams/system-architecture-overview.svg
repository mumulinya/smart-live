<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">SmartLive 系统架构总览</title>
  <desc id="desc">展示 SmartLive 的入口层、治理层、业务服务层和基础设施层，并为每个服务补充一句职责说明。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#effcf6"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5372a8"/>
    </marker>
    <style>
      .panel { fill: url(#bg); stroke: #d5e3ff; stroke-width: 2; }
      .card { stroke-width: 2; rx: 24; ry: 24; }
      .title { font: 700 36px 'Segoe UI', 'PingFang SC', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px 'Segoe UI', 'PingFang SC', sans-serif; fill: #334155; }
      .layer-label { font: 700 13px 'Segoe UI', 'PingFang SC', sans-serif; fill: #2563eb; letter-spacing: 0.08em; }
      .layer-title { font: 700 24px 'Segoe UI', 'PingFang SC', sans-serif; fill: #0f172a; }
      .layer-text { font: 400 15px 'Segoe UI', 'PingFang SC', sans-serif; fill: #475569; }
      .service { font: 700 20px 'Segoe UI', 'PingFang SC', sans-serif; fill: #0f172a; }
      .service-desc { font: 400 13px 'Segoe UI', 'PingFang SC', sans-serif; fill: #475569; }
      .mini { font: 400 12px 'Segoe UI', 'PingFang SC', sans-serif; fill: #64748b; }
      .infra { font: 700 18px 'Segoe UI', 'PingFang SC', sans-serif; fill: #0f172a; }
      .infra-desc { font: 400 13px 'Segoe UI', 'PingFang SC', sans-serif; fill: #475569; }
      .arrow { stroke: #5372a8; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7c93bf; stroke-width: 2.5; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="16" y="16" width="1768" height="1148" rx="28" ry="28" class="panel"/>

  <text x="900" y="72" text-anchor="middle" class="title">SmartLive-Cloud 系统架构</text>
  <text x="900" y="102" text-anchor="middle" class="subtitle">入口层、治理层、业务服务层、基础设施层统一放在一张图里，先看整体分层，再看具体模块职责。</text>

  <text x="100" y="152" class="layer-label">ENTRY LAYER</text>
  <rect x="720" y="130" width="360" height="84" class="card" fill="url(#green)" stroke="#34d399"/>
  <text x="900" y="166" text-anchor="middle" class="service">Nginx 反向代理</text>
  <text x="900" y="192" text-anchor="middle" class="service-desc">统一承接域名、静态资源、HTTPS 与请求转发</text>

  <rect x="420" y="250" width="380" height="92" class="card" fill="url(#blue)" stroke="#93c5fd"/>
  <text x="610" y="288" text-anchor="middle" class="service">管理端 Web（smartLive-admin）</text>
  <text x="610" y="315" text-anchor="middle" class="service-desc">店铺、商品、订单、审核、运营、系统后台</text>

  <rect x="1000" y="250" width="380" height="92" class="card" fill="url(#blue)" stroke="#93c5fd"/>
  <text x="1190" y="288" text-anchor="middle" class="service">用户端 App / H5（smartLive-web）</text>
  <text x="1190" y="315" text-anchor="middle" class="service-desc">发现、交易、评价、博客、消息与 AI 能力</text>

  <line x1="900" y1="214" x2="610" y2="250" class="dash"/>
  <line x1="900" y1="214" x2="1190" y2="250" class="dash"/>

  <text x="100" y="398" class="layer-label">GATEWAY &amp; GOVERNANCE</text>
  <rect x="640" y="376" width="520" height="92" class="card" fill="url(#purple)" stroke="#c084fc"/>
  <text x="900" y="414" text-anchor="middle" class="service">Spring Cloud Gateway</text>
  <text x="900" y="441" text-anchor="middle" class="service-desc">统一入口、路由转发、鉴权透传、边界过滤、限流防刷</text>

  <line x1="610" y1="342" x2="820" y2="376" class="arrow"/>
  <line x1="1190" y1="342" x2="980" y2="376" class="arrow"/>

  <rect x="180" y="510" width="260" height="88" class="card" fill="url(#orange)" stroke="#fb923c"/>
  <text x="310" y="546" text-anchor="middle" class="service">Auth 认证中心</text>
  <text x="310" y="572" text-anchor="middle" class="service-desc">登录、Token 签发、黑名单校验</text>

  <rect x="500" y="510" width="260" height="88" class="card" fill="url(#orange)" stroke="#fb923c"/>
  <text x="630" y="546" text-anchor="middle" class="service">Nacos 注册 / 配置</text>
  <text x="630" y="572" text-anchor="middle" class="service-desc">服务发现、配置中心、环境隔离</text>

  <rect x="820" y="510" width="260" height="88" class="card" fill="url(#orange)" stroke="#fb923c"/>
  <text x="950" y="546" text-anchor="middle" class="service">Sentinel 流量治理</text>
  <text x="950" y="572" text-anchor="middle" class="service-desc">限流、降级、熔断、热点参数保护</text>

  <rect x="1140" y="510" width="250" height="88" class="card" fill="url(#orange)" stroke="#fb923c"/>
  <text x="1265" y="546" text-anchor="middle" class="service">Seata Server</text>
  <text x="1265" y="572" text-anchor="middle" class="service-desc">分布式事务协同与回滚管理</text>

  <rect x="1440" y="510" width="180" height="88" class="card" fill="url(#orange)" stroke="#fb923c"/>
  <text x="1530" y="546" text-anchor="middle" class="service">Monitor</text>
  <text x="1530" y="572" text-anchor="middle" class="service-desc">服务监控与运维入口</text>

  <line x1="900" y1="468" x2="310" y2="510" class="dash"/>
  <line x1="900" y1="468" x2="630" y2="510" class="dash"/>
  <line x1="900" y1="468" x2="950" y2="510" class="dash"/>
  <line x1="900" y1="468" x2="1265" y2="510" class="dash"/>
  <line x1="900" y1="468" x2="1530" y2="510" class="dash"/>

  <text x="100" y="662" class="layer-label">BUSINESS SERVICES</text>
  <rect x="90" y="684" width="1620" height="280" rx="28" ry="28" fill="#ffffff" stroke="#d9e6ff" stroke-width="2" stroke-dasharray="6 6"/>

  <rect x="130" y="724" width="175" height="82" class="card" fill="url(#blue)" stroke="#93c5fd"/>
  <text x="218" y="756" text-anchor="middle" class="service">User</text>
  <text x="218" y="780" text-anchor="middle" class="service-desc">资料、主页、关注、用户侧能力</text>

  <rect x="325" y="724" width="175" height="82" class="card" fill="url(#blue)" stroke="#93c5fd"/>
  <text x="413" y="756" text-anchor="middle" class="service">Shop</text>
  <text x="413" y="780" text-anchor="middle" class="service-desc">店铺资料、详情、经营分析</text>

  <rect x="520" y="724" width="175" height="82" class="card" fill="url(#blue)" stroke="#93c5fd"/>
  <text x="608" y="756" text-anchor="middle" class="service">Blog</text>
  <text x="608" y="780" text-anchor="middle" class="service-desc">博客发布、详情读取、内容流</text>

  <rect x="715" y="724" width="175" height="82" class="card" fill="url(#blue)" stroke="#93c5fd"/>
  <text x="803" y="756" text-anchor="middle" class="service">Order</text>
  <text x="803" y="780" text-anchor="middle" class="service-desc">下单、状态流转、取消与退款</text>

  <rect x="910" y="724" width="175" height="82" class="card" fill="url(#blue)" stroke="#93c5fd"/>
  <text x="998" y="756" text-anchor="middle" class="service">AI</text>
  <text x="998" y="780" text-anchor="middle" class="service-desc">Spring AI、RAG、AIGC 能力</text>

  <rect x="1105" y="724" width="175" height="82" class="card" fill="url(#blue)" stroke="#93c5fd"/>
  <text x="1193" y="756" text-anchor="middle" class="service">Chat</text>
  <text x="1193" y="780" text-anchor="middle" class="service-desc">会话聚合、通知、离线消息</text>

  <rect x="1300" y="724" width="175" height="82" class="card" fill="url(#blue)" stroke="#93c5fd"/>
  <text x="1388" y="756" text-anchor="middle" class="service">Index</text>
  <text x="1388" y="780" text-anchor="middle" class="service-desc">首页聚合、统计读取、热门面板</text>

  <rect x="1495" y="724" width="175" height="82" class="card" fill="url(#blue)" stroke="#93c5fd"/>
  <text x="1583" y="756" text-anchor="middle" class="service">Search</text>
  <text x="1583" y="780" text-anchor="middle" class="service-desc">ES 检索、热词、LBS 排序</text>

  <rect x="227" y="838" width="175" height="82" class="card" fill="url(#blue)" stroke="#93c5fd"/>
  <text x="315" y="870" text-anchor="middle" class="service">Wallet</text>
  <text x="315" y="894" text-anchor="middle" class="service-desc">充值、支付记录、退款入账</text>

  <rect x="422" y="838" width="175" height="82" class="card" fill="url(#blue)" stroke="#93c5fd"/>
  <text x="510" y="870" text-anchor="middle" class="service">Interaction</text>
  <text x="510" y="894" text-anchor="middle" class="service-desc">点赞收藏、评论、Feed、热榜</text>

  <rect x="617" y="838" width="175" height="82" class="card" fill="url(#blue)" stroke="#93c5fd"/>
  <text x="705" y="870" text-anchor="middle" class="service">Points</text>
  <text x="705" y="894" text-anchor="middle" class="service-desc">积分、签到、抽奖、积分流水</text>

  <rect x="812" y="838" width="175" height="82" class="card" fill="url(#blue)" stroke="#93c5fd"/>
  <text x="900" y="870" text-anchor="middle" class="service">File</text>
  <text x="900" y="894" text-anchor="middle" class="service-desc">文件上传、头像替换、对象存储</text>

  <rect x="1007" y="838" width="175" height="82" class="card" fill="url(#blue)" stroke="#93c5fd"/>
  <text x="1095" y="870" text-anchor="middle" class="service">Product</text>
  <text x="1095" y="894" text-anchor="middle" class="service-desc">商品、团购、好券、秒杀库存</text>

  <rect x="1202" y="838" width="175" height="82" class="card" fill="url(#blue)" stroke="#93c5fd"/>
  <text x="1290" y="870" text-anchor="middle" class="service">Audit</text>
  <text x="1290" y="894" text-anchor="middle" class="service-desc">审核责任链、人工审核、状态回写</text>

  <rect x="1397" y="838" width="175" height="82" class="card" fill="url(#blue)" stroke="#93c5fd"/>
  <text x="1485" y="870" text-anchor="middle" class="service">IM</text>
  <text x="1485" y="894" text-anchor="middle" class="service-desc">Netty 长连接、即时消息推送</text>

  <line x1="310" y1="598" x2="320" y2="684" class="dash"/>
  <line x1="630" y1="598" x2="560" y2="684" class="dash"/>
  <line x1="950" y1="598" x2="980" y2="684" class="dash"/>
  <line x1="1265" y1="598" x2="1380" y2="684" class="dash"/>

  <text x="100" y="1028" class="layer-label">INFRASTRUCTURE</text>
  <rect x="120" y="1048" width="220" height="90" class="card" fill="url(#gold)" stroke="#f59e0b"/>
  <text x="230" y="1084" text-anchor="middle" class="infra">MySQL</text>
  <text x="230" y="1110" text-anchor="middle" class="infra-desc">核心业务主数据源</text>

  <rect x="360" y="1048" width="220" height="90" class="card" fill="url(#gold)" stroke="#f59e0b"/>
  <text x="470" y="1084" text-anchor="middle" class="infra">Redis</text>
  <text x="470" y="1110" text-anchor="middle" class="infra-desc">缓存 / ZSet / Lua / 幂等键</text>

  <rect x="600" y="1048" width="220" height="90" class="card" fill="url(#gold)" stroke="#f59e0b"/>
  <text x="710" y="1084" text-anchor="middle" class="infra">RabbitMQ</text>
  <text x="710" y="1110" text-anchor="middle" class="infra-desc">异步解耦 / 延迟 / 死信补偿</text>

  <rect x="840" y="1048" width="220" height="90" class="card" fill="url(#gold)" stroke="#f59e0b"/>
  <text x="950" y="1084" text-anchor="middle" class="infra">Elasticsearch</text>
  <text x="950" y="1110" text-anchor="middle" class="infra-desc">搜索副本 / 热词 / LBS</text>

  <rect x="1080" y="1048" width="220" height="90" class="card" fill="url(#gold)" stroke="#f59e0b"/>
  <text x="1190" y="1084" text-anchor="middle" class="infra">Milvus</text>
  <text x="1190" y="1110" text-anchor="middle" class="infra-desc">向量检索 / RAG 数据底座</text>

  <rect x="1320" y="1048" width="160" height="90" class="card" fill="url(#gold)" stroke="#f59e0b"/>
  <text x="1400" y="1084" text-anchor="middle" class="infra">MinIO</text>
  <text x="1400" y="1110" text-anchor="middle" class="infra-desc">对象存储</text>

  <rect x="1500" y="1048" width="190" height="90" class="card" fill="url(#gold)" stroke="#f59e0b"/>
  <text x="1595" y="1084" text-anchor="middle" class="infra">XXL-JOB</text>
  <text x="1595" y="1110" text-anchor="middle" class="infra-desc">调度兜底 / 批量重建</text>
</svg>
