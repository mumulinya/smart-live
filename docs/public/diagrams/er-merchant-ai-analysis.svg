<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="360" viewBox="0 0 1480 360" role="img" aria-labelledby="title desc">
  <title id="title">商家助手会话、评价、商品与分析快照关系图</title>
  <desc id="desc">展示 merchant_ai_session、merchant_ai_message、review、product、shop_analysis_record、shop 与 sys_user/sys_user_shop 的主要关系。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#a9bddf" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#607fb8"/>
    </marker>
    <style>
      .bg { fill: #f7faff; stroke: #d9e5f6; stroke-width: 2; }
      .title { font: 700 28px 'Segoe UI', 'PingFang SC', sans-serif; fill: #193055; }
      .sub { font: 400 15px 'Segoe UI', 'PingFang SC', sans-serif; fill: #60708e; }
      .group { fill: #ffffff; stroke: #dfe7f4; stroke-width: 2; }
      .bar-purple { fill: #f3ecff; stroke: #bfa7ff; }
      .bar-blue { fill: #ecf3ff; stroke: #b6caf6; }
      .bar-green { fill: #eefcf3; stroke: #a7e0bf; }
      .group-title { font: 700 18px 'Segoe UI', 'PingFang SC', sans-serif; fill: #213454; }
      .chip { rx: 12; ry: 12; stroke-width: 1.4; }
      .chip-purple { fill: #f7f2ff; stroke: #d2c0ff; }
      .chip-blue { fill: #eef5ff; stroke: #bdd0f7; }
      .chip-green { fill: #f1fcf6; stroke: #b7e4c9; }
      .chip-text { font: 600 17px 'Consolas', monospace; fill: #193055; }
      .line { fill: none; stroke: #607fb8; stroke-width: 3.4; marker-end: url(#arrow); }
      .line-dash { fill: none; stroke: #8ca5cf; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .legend { font: 400 14px 'Segoe UI', 'PingFang SC', sans-serif; fill: #6d7f9b; }
    </style>
  </defs>

  <rect x="12" y="12" width="1456" height="336" rx="28" ry="28" class="bg"/>
  <text x="48" y="54" class="title">商家助手会话 - 评价 / 商品 / 分析快照</text>
  <text x="48" y="82" class="sub">这组关系体现 AI 经营助手的数据落点：上下文如何沉淀，分析与建议又为什么能回溯到具体评价、商品和分析快照。</text>

  <g filter="url(#shadow)">
    <rect x="48" y="120" width="326" height="186" rx="24" ry="24" class="group"/>
    <rect x="68" y="138" width="170" height="30" rx="12" ry="12" class="bar-purple"/>
    <text x="84" y="159" class="group-title">AI 会话上下文</text>
    <rect x="68" y="198" width="198" height="36" class="chip chip-purple"/><text x="86" y="222" class="chip-text">merchant_ai_session</text>
    <rect x="68" y="248" width="216" height="36" class="chip chip-purple"/><text x="86" y="272" class="chip-text">merchant_ai_message</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="450" y="120" width="238" height="186" rx="24" ry="24" class="group"/>
    <rect x="470" y="138" width="144" height="30" rx="12" ry="12" class="bar-blue"/>
    <text x="486" y="159" class="group-title">关联业务数据</text>
    <rect x="470" y="198" width="126" height="36" class="chip chip-blue"/><text x="488" y="222" class="chip-text">review</text>
    <rect x="470" y="248" width="134" height="36" class="chip chip-blue"/><text x="488" y="272" class="chip-text">product</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="760" y="120" width="320" height="186" rx="24" ry="24" class="group"/>
    <rect x="780" y="138" width="170" height="30" rx="12" ry="12" class="bar-green"/>
    <text x="796" y="159" class="group-title">经营分析快照</text>
    <rect x="780" y="222" width="258" height="36" class="chip chip-green"/><text x="798" y="246" class="chip-text">shop_analysis_record</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1148" y="120" width="280" height="186" rx="24" ry="24" class="group"/>
    <rect x="1168" y="138" width="160" height="30" rx="12" ry="12" class="bar-blue"/>
    <text x="1184" y="159" class="group-title">归属与权限边界</text>
    <rect x="1168" y="198" width="108" height="36" class="chip chip-blue"/><text x="1186" y="222" class="chip-text">shop</text>
    <rect x="1168" y="248" width="214" height="36" class="chip chip-blue"/><text x="1186" y="272" class="chip-text">sys_user / sys_user_shop</text>
  </g>

  <path d="M 266 216 C 348 216, 382 216, 470 216" class="line-dash"/>
  <path d="M 266 266 C 348 266, 382 266, 470 266" class="line-dash"/>
  <path d="M 284 266 C 478 322, 652 322, 780 240" class="line"/>
  <path d="M 604 216 C 678 216, 710 216, 780 240" class="line-dash"/>
  <path d="M 604 266 C 674 266, 708 266, 780 240" class="line-dash"/>
  <path d="M 1038 240 C 1082 240, 1102 240, 1168 216" class="line-dash"/>
  <path d="M 220 198 C 220 128, 1230 128, 1230 248" class="line-dash"/>

  <text x="52" y="326" class="legend">AI 会话沉淀的是上下文与建议过程；真正的业务依据仍然回指评价、商品和经营分析快照。</text>
</svg>
