  <g filter="url(#softShadow)">
    <rect x="70" y="1308" width="630" height="118" rx="24" ry="24" class="stat-chip"/>
    <text x="102" y="1348" class="note-title">为什么这张图没有数据库外键线</text>
    <text x="102" y="1380" class="note-text">项目主关系以业务主键和软关联为主，ER 总览更强调领域边界与数据归属，避免被过细的字段线条淹没。</text>

    <rect x="734" y="1308" width="662" height="118" rx="24" ry="24" class="stat-chip"/>
    <text x="766" y="1348" class="note-title">为什么弱关系用虚线表示</text>
    <text x="766" y="1380" class="note-text">评论、点赞、收藏、审核、经营分析等能力经常通过 source_type + source_id 或 biz_id 建立多态引用，更适合画成治理辅助关系。</text>

    <rect x="1430" y="1308" width="656" height="118" rx="24" ry="24" class="stat-chip"/>
    <text x="1462" y="1348" class="note-title">哪些表被刻意排除在外</text>
    <text x="1462" y="1380" class="note-text">Nacos 配置中心运行表没有纳入核心业务 ER；它们属于基础设施运行数据，不属于 SmartLive 业务模型本身。</text>
  </g>
</svg>
