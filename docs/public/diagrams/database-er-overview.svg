<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1480" viewBox="0 0 2200 1480" role="img" aria-labelledby="title desc">
  <title id="title">SmartLive 数据库全库 ER 总览</title>
  <desc id="desc">按用户资产、店铺商品、交易履约、内容互动、消息会话、AI 审核、平台系统治理与 XXL-JOB 调度八个业务域，汇总展示 SmartLive 项目的核心库表与主要关系。</desc>
  <defs>
    <linearGradient id="canvasBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eaf2ff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#9fb4d8" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#c8d6ee" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowSolid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5673ab"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#89a0cb"/>
    </marker>
    <style>
      .canvas { fill: url(#canvasBg); stroke: #d7e3fb; stroke-width: 2; }
      .hero { fill: url(#heroBg); stroke: #dfe9fb; stroke-width: 2; }
      .hero-title { font: 700 44px 'Segoe UI', 'PingFang SC', sans-serif; fill: #16233b; }
      .hero-desc { font: 400 20px 'Segoe UI', 'PingFang SC', sans-serif; fill: #5d6d8d; }
      .section-card { fill: #ffffff; stroke: #dfe7f6; stroke-width: 2; }
      .section-bar { rx: 14; ry: 14; }
      .section-title { font: 700 30px 'Segoe UI', 'PingFang SC', sans-serif; fill: #16233b; }
      .section-sub { font: 400 16px 'Segoe UI', 'PingFang SC', sans-serif; fill: #62738f; }
      .section-count { font: 700 15px 'Segoe UI', 'PingFang SC', sans-serif; fill: #2f4d84; }
      .stat-chip { fill: #ffffff; stroke: #dfe7f6; stroke-width: 2; }
      .stat-k { font: 700 28px 'Segoe UI', 'PingFang SC', sans-serif; fill: #18315d; }
      .stat-v { font: 500 15px 'Segoe UI', 'PingFang SC', sans-serif; fill: #60708d; }
      .chip { rx: 12; ry: 12; stroke-width: 1.4; }
      .chip-text { font: 600 17px 'Consolas', 'SFMono-Regular', monospace; fill: #18315d; }
      .legend-title { font: 700 18px 'Segoe UI', 'PingFang SC', sans-serif; fill: #18315d; }
      .legend-text { font: 400 15px 'Segoe UI', 'PingFang SC', sans-serif; fill: #64748b; }
      .note-title { font: 700 20px 'Segoe UI', 'PingFang SC', sans-serif; fill: #18315d; }
      .note-text { font: 400 15px 'Segoe UI', 'PingFang SC', sans-serif; fill: #5f708e; }
      .solid { fill: none; stroke: #5673ab; stroke-width: 3.4; marker-end: url(#arrowSolid); }
      .dashed { fill: none; stroke: #89a0cb; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrowDash); }
      .mini-line { stroke-linecap: round; }
    </style>
  </defs>

  <rect x="16" y="16" width="2168" height="1448" rx="34" ry="34" class="canvas"/>

  <rect x="44" y="42" width="2112" height="160" rx="30" ry="30" class="hero"/>
  <text x="1100" y="106" text-anchor="middle" class="hero-title">SmartLive 数据库全库 ER 总览</text>
  <text x="1100" y="142" text-anchor="middle" class="hero-desc">53 张核心业务、治理与调度表按 8 个业务域重组展示，重点强调领域边界与主要关系，而不是字段级外键。</text>

  <g filter="url(#softShadow)">
    <rect x="78" y="228" width="210" height="82" rx="22" ry="22" class="stat-chip"/>
    <text x="108" y="270" class="stat-k">53 张</text>
    <text x="108" y="295" class="stat-v">纳入总览的核心表</text>

    <rect x="312" y="228" width="230" height="82" rx="22" ry="22" class="stat-chip"/>
    <text x="342" y="270" class="stat-k">8 个</text>
    <text x="342" y="295" class="stat-v">业务域 / 调度域分区</text>

    <rect x="566" y="228" width="280" height="82" rx="22" ry="22" class="stat-chip"/>
    <text x="596" y="270" class="stat-k">软关联优先</text>
    <text x="596" y="295" class="stat-v">与微服务边界和消息驱动一致</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="1574" y="220" width="582" height="110" rx="24" ry="24" class="stat-chip"/>
    <text x="1606" y="258" class="legend-title">读图说明</text>
    <line x1="1608" y1="286" x2="1676" y2="286" class="solid mini-line"/>
    <text x="1692" y="291" class="legend-text">主关系：订单、资产、内容、消息等关键数据流</text>
    <line x1="1608" y1="318" x2="1676" y2="318" class="dashed mini-line"/>
    <text x="1692" y="323" class="legend-text">弱耦合关系：source_id、biz_id、审核回写、分析快照</text>
  </g>

