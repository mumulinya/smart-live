<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="880" viewBox="0 0 1800 880" role="img" aria-labelledby="title desc">
  <title id="title">AI 结构化响应控制 JSON 回填链路</title>
  <desc id="desc">展示 SmartLive 中模型如何输出控制 JSON，后端再根据工具返回的真实店铺、商品、订单结果回填最终 card_render JSON。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#335c9e"/>
    </marker>
    <style>
      .title{font:700 34px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#17324f}
      .subtitle{font:500 18px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#4a6687}
      .section{font:700 22px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#214f87}
      .label{font:700 20px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#17324c}
      .text{font:500 15px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#425a74}
      .small{font:600 14px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#305276}
      .box{fill:#ffffff;stroke:#9db9dd;stroke-width:2;rx:22}
      .box-blue{fill:#eef5ff;stroke:#8eb0df;stroke-width:2;rx:22}
      .box-green{fill:#f1fbf6;stroke:#9bcdb0;stroke-width:2;rx:22}
      .box-orange{fill:#fff6ec;stroke:#efb175;stroke-width:2;rx:22}
      .box-purple{fill:#f7f2ff;stroke:#c5b1ef;stroke-width:2;rx:22}
      .note{fill:#ffffff;stroke:#d7e3f2;stroke-width:1.5;rx:18}
      .line{stroke:#335c9e;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#6d90bf;stroke-width:3;stroke-dasharray:8 8;fill:none;marker-end:url(#arrow)}
      .code{font:600 14px Consolas,'Courier New',monospace;fill:#24476f}
    </style>
  </defs>

  <rect width="1800" height="880" fill="url(#bg)"/>
  <rect x="34" y="34" width="1732" height="812" rx="30" fill="#ffffff" stroke="#d9e6f5" stroke-width="2"/>

  <text class="title" x="74" y="96">AI 结构化响应链路：控制 JSON 与真实数据回填</text>
  <text class="subtitle" x="74" y="132">核心思想：模型负责“选哪几条、说什么”，后端负责“把真实业务字段回填给前端”。</text>

  <text class="section" x="74" y="188">主链路</text>

  <rect class="box" x="70" y="224" width="220" height="120"/>
  <text class="label" x="180" y="270" text-anchor="middle">用户消息</text>
  <text class="text" x="180" y="300" text-anchor="middle">找店 / 查商品 / 下单</text>
  <text class="text" x="180" y="324" text-anchor="middle">自然语言问题</text>

  <rect class="box-orange" x="340" y="224" width="280" height="120"/>
  <text class="label" x="480" y="270" text-anchor="middle">Spring AI Alibaba 路由</text>
  <text class="text" x="480" y="300" text-anchor="middle">模型选择 shop / product / review agent</text>
  <text class="text" x="480" y="324" text-anchor="middle">并决定调用什么 Tool</text>

  <rect class="box-green" x="670" y="224" width="310" height="120"/>
  <text class="label" x="825" y="270" text-anchor="middle">Tool 查真实结果</text>
  <text class="text" x="825" y="300" text-anchor="middle">店铺 / 商品走 RAG 检索</text>
  <text class="text" x="825" y="324" text-anchor="middle">下单走真实 orderProduct</text>

  <rect class="box-purple" x="1030" y="224" width="300" height="120"/>
  <text class="label" x="1180" y="270" text-anchor="middle">模型输出控制 JSON</text>
  <text class="text" x="1180" y="300" text-anchor="middle">type + selectedIds + replyText</text>
  <text class="text" x="1180" y="324" text-anchor="middle">或 order / order_fail</text>

  <rect class="box-blue" x="1380" y="224" width="320" height="120"/>
  <text class="label" x="1540" y="270" text-anchor="middle">后端结构化收口</text>
  <text class="text" x="1540" y="300" text-anchor="middle">按 selectedIds 回填真实候选</text>
  <text class="text" x="1540" y="324" text-anchor="middle">按真实 orderId 组最终 JSON</text>

  <path class="line" d="M290 284 H328"/>
  <path class="line" d="M620 284 H658"/>
  <path class="line" d="M980 284 H1018"/>
  <path class="line" d="M1330 284 H1368"/>

  <rect class="box" x="580" y="430" width="640" height="156"/>
  <text class="label" x="610" y="472">模型输出的控制 JSON 示例</text>
  <text class="code" x="610" y="510">{</text>
  <text class="code" x="640" y="538">"type": "shop",</text>
  <text class="code" x="640" y="566">"replyText": "为您挑了几家更匹配的店铺",</text>
  <text class="code" x="640" y="594">"selectedIds": [1, 3, 8]</text>
  <text class="code" x="610" y="622">}</text>
  <text class="small" x="930" y="622">模型不直接生成 price / score / distance / orderId 等最终业务字段</text>

  <path class="dash" d="M1180 344 V 414"/>
  <text class="small" x="1200" y="392">控制信号</text>

  <rect class="box-green" x="120" y="654" width="480" height="130"/>
  <text class="label" x="150" y="696">店铺 / 商品场景</text>
  <text class="text" x="150" y="726">1. Tool 先查出 10 条真实候选</text>
  <text class="text" x="150" y="750">2. 模型只在 selectedIds 里保留真正推荐的几条</text>
  <text class="text" x="150" y="774">3. 后端按 selectedIds 回填真实 recommendations</text>

  <rect class="box-orange" x="660" y="654" width="480" height="130"/>
  <text class="label" x="690" y="696">下单场景</text>
  <text class="text" x="690" y="726">1. 模型判断下单意图并调用 orderProduct</text>
  <text class="text" x="690" y="750">2. 工具真实返回 success / orderId / failureMessage</text>
  <text class="text" x="690" y="774">3. 后端据此组 order 或 order_fail，订单号绝不交给模型编造</text>

  <rect class="box-blue" x="1200" y="654" width="480" height="130"/>
  <text class="label" x="1230" y="696">最终发给前端</text>
  <text class="text" x="1230" y="726">- 文本场景：SSE message</text>
  <text class="text" x="1230" y="750">- 结构化场景：SSE card_render</text>
  <text class="text" x="1230" y="774">- 前端消费的是后端统一组装后的最终 JSON</text>
</svg>
