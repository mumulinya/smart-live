# Tomcat
server:
  port: 9213

# Spring
spring:
  jackson:
    deserialization:
      read-unknown-enum-values-as-null: true
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.milvus.autoconfigure.MilvusVectorStoreAutoConfiguration
  main:
    allow-bean-definition-overriding: true
  elasticsearch:
    url: http://localhost:9200
  application:
    name: smartLive-ai
  rabbitmq:
    username: smart-live
    password: 123167
    host: ${RABBITMQ_HOST:192.168.182.20}
    virtual-host: smart-live
    port: 5672
  ai:
    vectorstore:
      milvus:
        enabled: ${MILVUS_ENABLED:true}
        host: ${MILVUS_HOST:192.168.182.20}
        port: 19530
        database-name: "default"
        embedding-dimension: 1024
        metric-type: COSINE
        index-type: FLAT
        initialize-schema: false
    # Keep zhipu starter disabled for chat to avoid enum parse incompatibility.
    zhipuai:
      api-key: 09efff4822ea42d2aaf63b60e127dfd9.kBLXYVD4YGfJUJES
      chat:
        enabled: false
        options:
          model: GLM-4.7-flash
    openai:
      api-key: sk-bTsi4ARaytKeClsp00658008F82a4d8d87D4EcEeA003E748
      chat:
        # Use Zhipu OpenAI-compatible endpoint
        base-url: https://open.bigmodel.cn
        completions-path: /api/paas/v4/chat/completions
        api-key: 09efff4822ea42d2aaf63b60e127dfd9.kBLXYVD4YGfJUJES
        options:
          model: GLM-4.7-flash
      embedding:
        base-url: https://api.siliconflow.cn
        api-key: sk-kyrqakqjbcbdkjyfdnoovhnmmoyhdggaalcpgqpmagkkyqcb
        options:
          model: BAAI/bge-m3
          dimensions: 1024
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:8848
      config:
        server-addr: ${NACOS_HOST:127.0.0.1}:8848
        file-extension: yml
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
