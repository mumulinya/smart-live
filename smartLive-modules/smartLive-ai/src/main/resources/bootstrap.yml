# Tomcat
server:
  port: 9213
#arthas
arthas:
  tunnel-server: ws://127.0.0.1:7777/ws
  app-name: ${spring.application.name}
  http-port: 9313
  telnet-port: 9413
# Spring
spring:
  application:
    name: smartLive-ai
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
  jackson:
    deserialization:
      read-unknown-enum-values-as-null: true
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.milvus.autoconfigure.MilvusVectorStoreAutoConfiguration
  main:
    allow-bean-definition-overriding: true
  elasticsearch:
    url: http://localhost:9200
  ai:
    template:
        renderer: simple
    openai:
      api-key:
      chat:
        enabled: true
        base-url: https://api.edgefn.net
        completions-path: /v1/chat/completions
        options:
            model: GLM-4.7
        timeout: 90s
      embedding:
        base-url: https://api.siliconflow.cn
        api-key:
        options:
          model: BAAI/bge-m3
          dimensions: 1024
    retry:
      max-attempts: 1
      on-client-errors: false
      on-http-codes:
        - 408
      exclude-on-http-codes:
        - 400
        - 401
        - 403
        - 404
        - 422
      backoff:
        initial-interval: 8s
        multiplier: 2
        max-interval: 30s
    vectorstore:
      milvus:
        enabled: true
        host: 192.168.182.20
        port: 19530
        database-name: default
        embedding-dimension: 1024
        metric-type: COSINE
        index-type: FLAT
        initialize-schema: ${SPRING_AI_VECTORSTORE_MILVUS_INITIALIZE_SCHEMA:true}
        collection-name: smartLive_vector_store
        recreate-collection: false
    rag:
      chunk-size: 1000
      chunk-overlap: 200
      retrieval-enabled: true
      retrieval-search-type: similarity
      retrieval-top-k: 5
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          - rabbitmq-common.yml
smartlive:
  ai:
    chat-model-bean: openAiChatModel
    framework:
      enabled: true  #开启智能agent
    autonomy:
      max-iterations: 6
      max-plan-steps: 4
      max-replans: 2
      max-runtime-seconds: 45
