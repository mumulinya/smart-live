# Spring AI 完整配置建议
# 将此文件内容添加到你的 bootstrap.yml 中，或者创建一个新的配置文件

spring:
  ai:
    # --- Chat Model 配置 ---
    zhipuai:
      api-key: 09efff4822ea42d2aaf63b60e127dfd9.kBLXYVD4YGfJUJES
      chat:
        enabled: true  # 改为true，使用智谱AI作为主要chat模型
        options:
          model: GLM-4.7-flash
          temperature: 0.7
          max-tokens: 4096
          top-p: 0.9

    openai:
      api-key: sk-bTsi4ARaytKeClsp00658008F82a4d8d87D4EcEeA003E748
      chat:
        base-url: https://open.bigmodel.cn
        completions-path: /api/paas/v4/chat/completions
        api-key: 09efff4822ea42d2aaf63b60e127dfd9.kBLXYVD4YGfJUJES
        options:
          model: GLM-4.7-flash
          temperature: 0.7
          max-tokens: 4096
          top-p: 0.9

    # --- Embedding 模型配置 ---
    embedding:
      options:
        model: BAAI/bge-m3
        dimensions: 1024
        timeout: 60s

    # --- Milvus 向量存储配置 ---
    vectorstore:
      milvus:
        enabled: ${MILVUS_ENABLED:true}
        host: ${MILVUS_HOST:192.168.182.20}
        port: 19530
        database-name: "default"
        embedding-dimension: 1024
        metric-type: COSINE
        index-type: FLAT
        initialize-schema: false
        collection-name: smartLive_vector_store
        recreate-collection: false

    # --- RAG 配置 (可选) ---
    rag:
      chunk-size: 1000
      chunk-overlap: 200
      retrieval-enabled: true
      retrieval-search-type: similarity
      retrieval-top-k: 5

