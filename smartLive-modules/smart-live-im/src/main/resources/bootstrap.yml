# Tomcat
server:
  port: 9217 # IM模块端口 (API端口, Netty是8888)

# Spring
spring:
  application:
    name: smartLive-im
  rabbitmq:
    username: smart-live
    password: 123167
    host: 192.168.182.20
    virtual-host: smart-live
    port: 5672
    publisher-confirm-type: correlated #开启publisher confirm机制 并设置confirm的类型
    publisher-returns: true #开启return模式( 消息从 exchange –> queue 投递失败则会返回一个 returnCallback；)
    connection-timeout: 1s # 连接超时时间
    template:
      retry:
        enabled: true # 开启重试
        multiplier: 2 # 重试乘数

  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
      config:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
        file-extension: yml
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
