# Tomcat
server:
  port: 9206
#arthas
arthas:
  tunnel-server: ws://127.0.0.1:7777/ws
  app-name: ${spring.application.name}
  http-port: 9306
  telnet-port: 9406
# Spring
spring: 
  application:
    # 应用名称
    name: smartLive-product
  rabbitmq:
    connection-timeout: 10000 # 连接超时时间（毫秒）
    template:
      retry:
        enabled: true #开启重试
    publisher-confirm-type: correlated # 开启发生着确认模式，可选值：correlated、none、manual
    publisher-returns: true # 开启返回确认
    listener:
      simple:
        consumer-batch-enabled: true
        batch-size: 100
        # 让它最多等 1000 毫秒，到了 1 秒没满 100 个也立即出列交由监听器执行
        receive-timeout: 1000ms 
        # 为了让批量收集威力最大化，prefetch 预取数量需至少等于 batch-size
        prefetch: 100 
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
  profiles:
    # 环境配置
    active: dev
  cloud:
    sentinel:
      enabled: true
      transport:
        dashboard: localhost:8718  #sentinel的控制台地址
        port: 8722
      http-method-specify: true #是否设置请求方式
      eager: true
      filter:
        enabled: true
        order: -100
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 127.0.0.1:8848
      config:
        # 配置中心地址
        server-addr: 127.0.0.1:8848
        # 配置文件格式
        file-extension: yml
        # 统一使用 extension-configs 引入外部配置
        extension-configs:
          # 1. 引入全局环境配置
          - data-id: application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
            group: DEFAULT_GROUP
            refresh: true
          # 2. 引入 RabbitMQ 公共配置
          - data-id: rabbitmq-common.yml
            group: DEFAULT_GROUP
            refresh: true
          # 3. 引入 XXL-JOB 公共配置
          - data-id: xxl-job-common.yml
            group: DEFAULT_GROUP
            refresh: true # 支持动态刷新

