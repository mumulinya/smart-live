# Tomcat
server:
  port: 9207
#arthas
arthas:
  tunnel-server: ws://127.0.0.1:7777/ws
  app-name: ${spring.application.name}
  http-port: 9307
  telnet-port: 9407
# Spring
spring: 
  application:
    # 应用名称
    name: smartLive-interaction
  rabbitmq:
    username: smart-live
    password: 123167
    host: 192.168.182.20
    virtual-host: smart-live
    port: 5672
    listener:
      simple:
        acknowledge-mode: manual   #none：关闭ack  manual：手动ack  auto：自动ack
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 127.0.0.1:8848
      config:
        # 配置中心地址
        server-addr: 127.0.0.1:8848
        # 配置文件格式
        file-extension: yml
        # 统一使用 extension-configs 引入外部配置
        extension-configs:
            # 1. 引入全局环境配置
            - data-id: application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
              group: DEFAULT_GROUP
              refresh: true
           # 2. 引入 XXL-JOB 公共配置
            - data-id: xxl-job-common.yml
              group: DEFAULT_GROUP
              refresh: true # 支持动态刷新
