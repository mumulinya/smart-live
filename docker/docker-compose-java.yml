version: '3.8'

networks:
  default:
    name: smartlive-net

services:
  # =========================================
  # 1. 核心网关与认证 (Gateway & Auth)
  # =========================================

  # API 网关 [8080]
  smartLive-gateway:
    container_name: smartLive-gateway
    image: smartlive-gateway
    environment:
      - MIDDLEWARE_HOST=${MIDDLEWARE_HOST}
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=${MIDDLEWARE_HOST}:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=${MIDDLEWARE_HOST}:8848
      - SPRING_REDIS_HOST=${MIDDLEWARE_HOST}
      - SPRING_REDIS_PORT=6379
      - SPRING_DATA_REDIS_HOST=${MIDDLEWARE_HOST}
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD=smartLive-sentinel:8718
      - SPRING_CLOUD_SENTINEL_DATASOURCE_DS1_NACOS_SERVER_ADDR=${MIDDLEWARE_HOST}:8848
    build:
      context: ./smartLive/gateway
      dockerfile: dockerfile
    ports:
      - "8080:8080"

  # 认证中心 [9900]
  smartLive-auth:
    container_name: smartLive-auth
    image: smartlive-auth
    environment:
      - MIDDLEWARE_HOST=${MIDDLEWARE_HOST}
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=${MIDDLEWARE_HOST}:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=${MIDDLEWARE_HOST}:8848
      - SPRING_REDIS_HOST=${MIDDLEWARE_HOST}
      - SPRING_REDIS_PORT=6379
      - SPRING_DATA_REDIS_HOST=${MIDDLEWARE_HOST}
      - SPRING_DATA_REDIS_PORT=6379
    build:
      context: ./smartLive/auth
      dockerfile: dockerfile
    ports:
      - "9900:9900"

  # =========================================
  # 2. 业务微服务模块 (Business Modules)
