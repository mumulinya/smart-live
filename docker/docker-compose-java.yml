      - SPRING_REDIS_HOST=${MIDDLEWARE_HOST}
      - SPRING_REDIS_PORT=6379
      - SPRING_DATA_REDIS_HOST=${MIDDLEWARE_HOST}
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:mysql://${MIDDLEWARE_HOST}:3306/smart-live_user?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME=root
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD=123167
      - SPRING_RABBITMQ_HOST=${MIDDLEWARE_HOST}
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=smart-live
      - SPRING_RABBITMQ_PASSWORD=123167
    build:
