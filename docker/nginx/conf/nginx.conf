worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # 根路径重定向到 app
        location = / {
            return 302 /app/;
        }

        location = /app {
            return 301 /app/;
        }

        location = /admin {
            return 301 /admin/;
        }

        location = /login {
            return 302 /admin/login$is_args$args;
        }

        location = /register {
            return 302 /admin/register$is_args$args;
        }

        # 用户端前端
        location /app/ {
            alias  /home/smartLive/projects/web/;
            try_files $uri $uri/ /app/index.html;
            index  index.html index.htm;
        }

        # 管理后台前端
        location /admin/ {
            alias  /home/smartLive/projects/admin/;
            try_files $uri $uri/ /admin/index.html;
            index  index.html index.htm;
        }

        # 静态资源
        location /static/ {
            alias  /home/smartLive/projects/admin/static/;
            try_files $uri $uri/ =404;
        }

        location = /favicon.ico {
            alias  /home/smartLive/projects/admin/favicon.ico;
        }

        # 图片资源（修复 /imgs/ 404 问题）
        location /imgs/ {
            alias  /home/smartLive/projects/web/imgs/;
            try_files $uri $uri/ =404;
        }

        # 管理后台 API 代理（/dev-api/ -> 网关）
        location /dev-api/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://159.75.5.17:8080/;
        }

        # 用户端 API 代理（/app-dev-api/ -> 网关）
        location /app-dev-api/ {
            default_type  application/json;
            keepalive_timeout   30s;
            keepalive_requests  1000;
            proxy_http_version 1.1;
            rewrite ^/app-dev-api(/.*)$ $1 break;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass_request_headers on;
            proxy_next_upstream error timeout;
            proxy_pass http://159.75.5.17:8080/;
        }

        # 禁止暴露 actuator
        location ~* /actuator {
            return 403;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    # 管理后台独立端口（开发调试用）
    server {
        listen       8081;
        server_name  localhost;

        location / {
            root   /home/smartLive/projects/admin;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location /app-dev-api/ {
            default_type  application/json;
            keepalive_timeout   30s;
            keepalive_requests  1000;
            proxy_http_version 1.1;
            rewrite ^/app-dev-api(/.*)$ $1 break;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass_request_headers on;
            proxy_next_upstream error timeout;
            proxy_pass http://159.75.5.17:8080/;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
