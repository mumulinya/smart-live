  # 代码生成模块 [9211]
  smartLive-modules-gen:
    container_name: smartLive-modules-gen
    image: smartlive-modules-gen
    environment:
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=smartLive-nacos:8848
